name = "Tarefas"
description = "Tarefas com prazo e prioridade, que podem ser atribuídas por compartilhamento"
label = "Tarefas"
details = "Mantenha uma lista de coisas a fazer, cada uma com prazo e prioridade.\n\nAtribua uma tarefa compartilhando-a: quem a recebe a encontra na própria lista. Marque-a como concluída quando terminar; as tarefas concluídas continuam visíveis até você arrumá-las.\n\nAs tarefas são itens da plataforma: têm seu próprio nível de compartilhamento, um lugar na busca e na lixeira."

