name = "Chat"
description = "Chat como o Microsoft Teams: chats individuais e em grupo com presença, confirmações de leitura, reações, menções, arquivos e chamadas"
label = "Chat"
details = "Converse com seus colegas como no Microsoft Teams: chats individuais e em grupo, uma lista com as mensagens não lidas, chats fixados e silenciados, quem está online, quem está digitando e quem viu sua mensagem.\n\nEscreva com formatação, mencione pessoas com @, marque uma mensagem como Importante ou Urgente, responda com uma citação, reaja com um emoji, fixe uma mensagem, anexe arquivos do seu dispositivo ou de Documentos e pesquise o que foi dito. Os botões Chamar e Vídeo iniciam uma chamada em grupo no chat, e a chamada fica na conversa com quem entrou e quanto tempo durou.\n\nUm chat é privado para quem participa: ele é compartilhado com cada pessoa e qualquer uma pode adicionar outras (com ou sem o histórico anterior). O histórico que um recém-chegado não vê é ocultado pela página, não pela plataforma. Os canais das versões anteriores continuam lá, em Canais.\n\nO que o plugin pede: encontrar as pessoas da sua organização para conversar (diretório), avisá-las (notificações), mostrar o serviço de chamadas (meet.jit.si) com câmera e microfone, e ler e adicionar arquivos em Documentos para os anexos."

