id = "com.mosaikit.surveys"
name = "Surveys"
version = "0.1.1"
kind = "app"
# icon of the shell (Lucide); contribution.icon stays for older hosts
icon = "clipboard-list"
description = "Series of questions answered by the people a survey is shared with, with the results per question and scored quizzes"
author = "Mosaikit"
license = "Apache-2.0"
details = "Build a survey with up to 40 questions (one answer, several answers, free text or a scale from 1 to 5), share it and see the results per question: a bar for each option, the average of a scale and the text answers. Each person answers once, and the results can be exported to CSV.\n\nIn quiz mode the answers are scored: mark the correct options and the points of each question, set a pass mark and every person sees their score and whether they passed, with the right and wrong answers shown only after they submit.\n\nA survey is an item of the platform: share it with people or groups (read to answer it, write to see all the results and edit it) and everything you already know about sharing, search and the trash applies."
screenshots = ["survey.svg", "results.svg"]
homepage = "https://example.org/mosaikit/plugins/surveys"

[requires]
mosaikit = ">=1.0, <2"
api = 1

[contribution]
icon = "📋"
label = "Surveys"

[[resources]]
name = "surveys"
label = "Surveys"
title_field = "title"
fields = [
  { key = "title", label = "Title", kind = "text", required = true },
  { key = "intro", label = "Introduction", kind = "text", multiline = true },
  # a JSON array of questions {id, text, kind, options, correct, points, required}, edited by the UI
  { key = "questions", label = "Questions", kind = "text", hidden = true },
  { key = "quiz", label = "Quiz (scored)", kind = "bool" },
  # a whole number from 0 to 100, checked by the hook
  { key = "pass_percent", label = "Pass mark (%)", kind = "text" },
  { key = "closes_on", label = "Closes on", kind = "date" },
  { key = "closed", label = "Closed", kind = "bool" },
]

# the answers: a reader writes the row of their own answers (command surveys.submit)
[[tables]]
name = "responses"
insert_for = "reader"
owner_column = "user_id"

[ui]
entry = "index.html"

[permissions]
hooks = ["surveys"]

[[kpi]]
view = "kpi_surveys_status"
label = "Status of the surveys"

[[contributes]]
point = "com.mosaikit.dashboard.widget"
id = "open-surveys"
label = "Open surveys"
data = { command = "surveys.widget_open", kind = "number", size = "s", texts = { en = { secondary = "open in all", empty = "No open surveys" }, it = { label = "Questionari aperti", secondary = "aperti in tutto", empty = "Nessun questionario aperto" }, es = { label = "Encuestas abiertas", secondary = "abiertas en total", empty = "No hay encuestas abiertas" } } }

# Italian translation of the texts above (missing keys fall back to English).
[i18n.it]
details = "Costruisci un sondaggio con fino a 40 domande (una risposta, più risposte, testo libero o una scala da 1 a 5), condividilo e guarda i risultati per domanda: una barra per ogni opzione, la media di una scala e le risposte di testo. Ognuno risponde una sola volta e i risultati si esportano in CSV.\n\nIn modalità quiz le risposte hanno un punteggio: segna le opzioni corrette e i punti di ogni domanda, imposta una soglia di superamento e ognuno vede il proprio punteggio e se ha superato la prova; le risposte giuste e sbagliate si mostrano solo dopo l’invio.\n\nUn sondaggio è un elemento della piattaforma: condividilo con persone o gruppi (lettura per rispondere, scrittura per vedere tutti i risultati e modificarlo) e vale tutto ciò che sai già su condivisione, ricerca e cestino."
name = "Sondaggi"
description = "Serie di domande a cui rispondono le persone con cui il sondaggio è condiviso, con i risultati per domanda e quiz con punteggio"
label = "Sondaggi"

[i18n.it.resources.surveys]
label = "Sondaggi"
fields = { title = "Titolo", intro = "Introduzione", questions = "Domande", quiz = "Quiz (con punteggio)", pass_percent = "Soglia di superamento (%)", closes_on = "Si chiude il", closed = "Chiuso" }

[i18n.it.kpi.kpi_surveys_status]
label = "Stato dei sondaggi"
columns = { surveys = "sondaggi", open_surveys = "aperti", responses = "risposte" }
