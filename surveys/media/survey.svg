<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Surveys: answering a quiz, one question per card with a progress bar" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect width="960" height="540" fill="#f4f5f7"/>
<rect x="0" y="0" width="200" height="540" fill="#ffffff" stroke="#dfe2e8"/><rect x="16" y="16" width="28" height="28" rx="8" fill="#3f51b5"/><rect x="10" y="66" width="180" height="32" rx="8" fill="#e8eaf6"/><rect x="22" y="74" width="16" height="16" rx="4" fill="#3f51b5"/><text x="48" y="87" font-size="14" fill="#3f51b5" font-weight="600">Surveys</text><rect x="22" y="112" width="16" height="16" rx="4" fill="#b9bfcc"/><text x="48" y="125" font-size="14" fill="#1f2430">Documents</text><rect x="22" y="150" width="16" height="16" rx="4" fill="#b9bfcc"/><text x="48" y="163" font-size="14" fill="#1f2430">Tasks</text><rect x="22" y="188" width="16" height="16" rx="4" fill="#b9bfcc"/><text x="48" y="201" font-size="14" fill="#1f2430">Chat</text><rect x="22" y="226" width="16" height="16" rx="4" fill="#b9bfcc"/><text x="48" y="239" font-size="14" fill="#1f2430">Meet</text><line x1="0" y1="476" x2="200" y2="476" stroke="#dfe2e8"/><circle cx="30" cy="508" r="14" fill="#7b8fd1"/><text x="30" y="512" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">GM</text><text x="52" y="504" font-size="12" fill="#1f2430" font-weight="600">Giulia Marini</text><text x="52" y="519" font-size="11" fill="#6b7280">Acme srl</text><text x="228" y="44" font-size="24" fill="#1f2430" font-weight="600">Onboarding quiz</text><rect x="420" y="28" width="42" height="20" rx="10" fill="none" stroke="#3f51b5"/><text x="441.0" y="42" font-size="11" fill="#3f51b5" font-weight="700" text-anchor="middle">QUIZ</text><rect x="228" y="70" width="700" height="8" rx="4" fill="#dfe2e8"/><rect x="228" y="70" width="350" height="8" rx="4" fill="#3f51b5"/><text x="228" y="98" font-size="12" fill="#6b7280">Answered 2 of 4</text><rect x="228" y="112" width="700" height="130" rx="14" fill="#ffffff" stroke="#dfe2e8"/><text x="250" y="142" font-size="15" fill="#1f2430" font-weight="600">1. Where do you find the expense policy?</text><circle cx="262" cy="168" r="7" fill="none" stroke="#3f51b5" stroke-width="2"/><circle cx="262" cy="168" r="3.5" fill="#3f51b5"/><text x="280" y="173" font-size="13" fill="#1f2430">In the handbook</text><circle cx="262" cy="192" r="7" fill="none" stroke="#b9bfcc" stroke-width="2"/><text x="280" y="197" font-size="13" fill="#1f2430">On the notice board</text><circle cx="262" cy="216" r="7" fill="none" stroke="#b9bfcc" stroke-width="2"/><text x="280" y="221" font-size="13" fill="#1f2430">Nowhere</text><rect x="228" y="256" width="700" height="140" rx="14" fill="#ffffff" stroke="#dfe2e8"/><text x="250" y="286" font-size="15" fill="#1f2430" font-weight="600">2. Which of these are safety rules? (several)</text><rect x="255" y="303" width="14" height="14" rx="3" fill="#3f51b5" stroke="#3f51b5" stroke-width="2"/><path d="M258 310 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none"/><text x="280" y="315" font-size="13" fill="#1f2430">Wear the badge</text><rect x="255" y="327" width="14" height="14" rx="3" fill="#3f51b5" stroke="#3f51b5" stroke-width="2"/><path d="M258 334 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none"/><text x="280" y="339" font-size="13" fill="#1f2430">Report any accident</text><rect x="255" y="351" width="14" height="14" rx="3" fill="#ffffff" stroke="#b9bfcc" stroke-width="2"/><text x="280" y="363" font-size="13" fill="#1f2430">Skip the training</text><rect x="228" y="410" width="700" height="90" rx="14" fill="#ffffff" stroke="#dfe2e8"/><text x="250" y="440" font-size="15" fill="#1f2430" font-weight="600">3. How clear was the first week?</text><rect x="250" y="454" width="44" height="32" rx="8" fill="#e8eaf6"/><text x="272" y="475" font-size="13" fill="#1f2430" font-weight="600" text-anchor="middle">1</text><rect x="302" y="454" width="44" height="32" rx="8" fill="#e8eaf6"/><text x="324" y="475" font-size="13" fill="#1f2430" font-weight="600" text-anchor="middle">2</text><rect x="354" y="454" width="44" height="32" rx="8" fill="#e8eaf6"/><text x="376" y="475" font-size="13" fill="#1f2430" font-weight="600" text-anchor="middle">3</text><rect x="406" y="454" width="44" height="32" rx="8" fill="#3f51b5"/><text x="428" y="475" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">4</text><rect x="458" y="454" width="44" height="32" rx="8" fill="#e8eaf6"/><text x="480" y="475" font-size="13" fill="#1f2430" font-weight="600" text-anchor="middle">5</text><rect x="808" y="500" width="120" height="34" rx="9" fill="#3f51b5"/><text x="868.0" y="522" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">Submit</text>
</svg>
