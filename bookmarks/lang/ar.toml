name = "الإشارات المرجعية"
description = "مجموعة مشتركة من الإشارات المرجعية لروابط الويب مع ملاحظة ووسوم، تُفتح في علامة تبويب جديدة أو في منطقة المحتوى، للعثور عليها مجددًا ومشاركتها مع أشخاص ومجموعات"
label = "الإشارات المرجعية"
details = "احفظ الروابط التي يعود إليها فريقك كثيرًا: لكل إشارة مرجعية عنوان، وعنوان الرابط، وملاحظة، ووسوم. ابحث بأي منها، وصفِّ بحسب الوسم، وضع في المفضلة ما تستخدمه أكثر، وافتح الرابط أو انسخه بنقرة واحدة.\n\nالإشارة المرجعية عنصر في المنصة: شاركها مع أشخاص أو مجموعات (القراءة للاطلاع، والكتابة للتعديل)، وينطبق عليها كل ما تعرفه عن المشاركة والبحث وسلة المحذوفات. تُقبل عناوين http وhttps فقط.\n\nتُفتح الإشارة المرجعية في علامة تبويب جديدة أو داخل المنصة في منطقة المحتوى، كما تختار لكل واحدة (الموقع الذي لا يسمح بعرضه داخل صفحة أخرى يُفتح في علامة تبويب جديدة). عند حفظ إشارة مرجعية تفحص المنصة الصفحة مرة واحدة لتعبئة العنوان وصورة تركتهما فارغين؛ ولا يُنزَّل شيء آخر."

