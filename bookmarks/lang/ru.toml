name = "Закладки"
description = "Общая коллекция веб-ссылок с заметкой и метками, открываемых в новой вкладке или в области содержимого, чтобы быстро находить их снова и делиться ими с людьми и группами"
label = "Закладки"
details = "Сохраняйте ссылки, к которым ваша команда возвращается часто: у каждой закладки есть заголовок, адрес, заметка и метки. Ищите по любому из этих полей, фильтруйте по метке, отмечайте избранным то, чем пользуетесь чаще всего, и открывайте или копируйте ссылку одним щелчком.\n\nЗакладка — это элемент платформы: делитесь ею с людьми или группами (чтение — чтобы видеть её, запись — чтобы редактировать), и на неё распространяется всё, что вы уже знаете об общем доступе, поиске и корзине. Принимаются только адреса http и https.\n\nЗакладка открывается в новой вкладке или внутри платформы, в области содержимого, как вы выберете для каждой (сайт, который нельзя показать внутри другой страницы, открывается в новой вкладке). При сохранении закладки платформа один раз смотрит страницу, чтобы заполнить пустые заголовок и изображение; больше ничего не скачивается."

[resources.bookmarks]
label = "Закладки"
fields = { title = "Заголовок", url = "Адрес", note = "Заметка", tags = "Метки", favorite = "Избранное", open_mode = "Открывается", thumbnail = "Миниатюра" }

