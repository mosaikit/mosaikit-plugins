name = "Favoritos"
description = "Uma coleção compartilhada de links da web com nota e etiquetas, abertos em uma nova guia ou na área de conteúdo, para encontrá-los de novo e compartilhá-los com pessoas e grupos"
label = "Favoritos"
details = "Guarde os links a que sua equipe volta com frequência: cada favorito tem um título, o endereço, uma nota e etiquetas. Busque por qualquer um deles, filtre por etiqueta, marque como preferidos os que mais usa e abra ou copie um link com um clique.\n\nUm favorito é um elemento da plataforma: compartilhe-o com pessoas ou grupos (leitura para vê-lo, escrita para editá-lo) e vale tudo o que você já sabe sobre compartilhar, buscar e a lixeira. Só são aceitos endereços http e https.\n\nUm favorito abre em uma nova guia ou dentro da plataforma, na área de conteúdo, como você escolher para cada um (um site que não permite ser mostrado dentro de outra página abre em uma nova guia). Ao salvar um favorito, a plataforma olha a página uma vez para preencher o título e uma imagem que você deixou vazios; nada mais é baixado."

