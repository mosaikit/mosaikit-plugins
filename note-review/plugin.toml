# Sample extension of Notes (docs/architecture.md, "Extensions"): it adds to the notes a "Reviewed"
# field, who reviewed them, an action to mark them as reviewed and a "Review" tab with the history of
# the reviews. No logic of its own: the kernel keeps the values, Notes shows the fields and the action
# (mountCrud of @mosaikit/plugin-api does it by itself) and the host draws the tab, a page of this UI.
id = "com.mosaikit.note-review"
name = "Note review"
version = "0.2.1"
description = "Marks notes as reviewed, with who did it and the history of the reviews"
author = "Mosaikit"
license = "Apache-2.0"
details = "Adds a Review tab to the notes of the Notes app. A reviewer marks a note as reviewed, with an optional comment; the tab shows who did it, when, and the history of the reviews.\n\nAn extension: it works only where Notes is installed, and its permission decides who may review."
screenshots = ["review.svg", "history.svg"]
homepage = "https://example.org/mosaikit/plugins/note-review"
kind = "extension"
icon = "badge-check"

[contribution]
icon = "✔"
label = "Note review"

[extends]
plugin = "com.mosaikit.notes"
min_version = "0.4.0"

# the UI of an extension holds the pages of its tabs (index.html says what the extension is when it is
# opened on its own)
[ui]
entry = "index.html"

[[extension.fields]]
resource = "notes"
key = "reviewed"
label = "Reviewed"
kind = "bool"

[[extension.fields]]
resource = "notes"
key = "reviewed_by"
label = "Reviewed by"
kind = "text"

# the reviews, kept for the tab (a JSON list); not shown among the fields of the note
[[extension.fields]]
resource = "notes"
key = "history"
label = "History of the reviews"
kind = "text"
multiline = true
hidden = true

[[extension.actions]]
resource = "notes"
key = "mark_reviewed"
label = "Mark as reviewed"
set = { reviewed = true, reviewed_by = "$user" }

[[extension.tabs]]
resource = "notes"
key = "review"
label = "Review"
icon = "clipboard-check"
page = "tab.html"

# Italian translation of the texts above (missing keys fall back to English).
[i18n.it]
details = "Aggiunge una scheda Revisione alle note dell’app Note. Chi rivede segna la nota come rivista, con un commento facoltativo; la scheda mostra chi l’ha fatto, quando e la cronologia delle revisioni.\n\nUn’estensione: funziona solo dove è installata Note, e la sua autorizzazione decide chi può rivedere."
name = "Revisione delle note"
description = "Segna le note come revisionate, con chi lo ha fatto e la storia delle revisioni"
label = "Revisione delle note"
extension = { fields = { reviewed = "Revisionata", reviewed_by = "Revisionata da", history = "Storia delle revisioni" }, actions = { mark_reviewed = "Segna come revisionata" }, tabs = { review = "Revisione" } }
