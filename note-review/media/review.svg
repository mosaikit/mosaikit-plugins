es</text><text x="271" y="124" font-size="13" fill="#6b7280" text-anchor="middle">Note</text><rect x="312" y="132" width="70" height="3" rx="2" fill="#3f51b5"/><text x="347" y="124" font-size="13" fill="#3f51b5" font-weight="600" text-anchor="middle">Review</text><text x="423" y="124" font-size="13" fill="#6b7280" text-anchor="middle">Sharing</text><line x1="220" y1="135" x2="944" y2="135" stroke="#dfe2e8" stroke-width="1"/><text x="240" y="164" font-size="15" fill="#1f2430" font-weight="600">Review this note</text><text x="240" y="184" font-size="13" fill="#6b7280">Mark it as reviewed when you checked the content. A comment is optional.</text><text x="240" y="224" font-size="13" fill="#6b7280" font-weight="600">Comment</text><rect x="240" y="234" width="684" height="110" rx="8" fill="#fff" stroke="#dfe2e8"/><text x="256" y="262" font-size="14" fill="#1f2430">Dates are correct; add the room for the 6 Nov review.</text><rect x="240" y="366" width="160" height="32" rx="7" fill="#3f51b5"/><text x="320" y="387" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">Mark as reviewed</text><text x="416" y="387" font-size="12" fill="#6b7280">Only reviewers see this button</text><line x1="240" y1="420" x2="924" y2="420" stroke="#dfe2e8" stroke-width="1"/><text x="240" y="450" font-size="13" fill="#6b7280" font-weight="600">Last review</text><text x="240" y="474" font-size="13" fill="#6b7280">Never. Awaiting the first reviewer.</text>
