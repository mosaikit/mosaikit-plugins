name = "مساعد الذكاء الاصطناعي"
description = "مساعد تتحدث معه لتحليل بياناتك وقراءة مؤشرات الأداء وإعداد المنصة وإنشاء العناصر في التطبيقات، مع محادثات محفوظة وخادم MCP لعملاء الذكاء الاصطناعي الخارجيين"
label = "مساعد الذكاء الاصطناعي"
details = "اسأل بكلماتك: ماذا يحدث في مؤسستي، وما المهام المتأخرة، وأنشئ ملاحظة بهذا المحضر. يستخدم المساعد الأدوات التي تقدمها التطبيقات ويتصرف دائمًا بصلاحياتك أنت: يرى ما تراه ويستطيع فعل ما تستطيع فعله، دون زيادة. أي شيء يغيّر البيانات يُقترح فقط؛ تراجعه أنت وتطلب منك المنصة التأكيد قبل تنفيذه.\n\nتُحفظ محادثاتك كعناصر خاصة بك: أعد فتح محادثة أو أعد تسميتها أو احذفها. ويتوفر المساعد أيضًا من الشريط العلوي كلوحة جانبية في أي صفحة.\n\nتُقدَّم الأدوات نفسها لعملاء الذكاء الاصطناعي الخارجيين (مثل Claude Desktop) عبر خادم MCP. في الرموز تنشئ رمز وصول شخصيًا، للقراءة فقط ما لم تفعّل الكتابة، وتنسخ إعدادات الاتصال.\n\nيحدد المسؤول نموذج اللغة (Anthropic أو OpenAI أو خادمًا متوافقًا مع OpenAI مثل Ollama) في النظام › مساعد الذكاء الاصطناعي؛ وعند السماح بذلك، يمكن لمدير المؤسسة إحضار مفتاح خاص بالمؤسسة."

