name = "ИИ-ассистент"
description = "Ассистент, с которым можно общаться, чтобы анализировать данные, читать KPI, настраивать платформу и создавать элементы в приложениях; с сохранёнными чатами и сервером MCP для внешних ИИ-клиентов"
label = "ИИ-ассистент"
details = "Спрашивайте обычными словами: что происходит в моей организации, какие задачи просрочены, создай заметку с этим протоколом. Ассистент использует инструменты, которые предлагают приложения, и всегда действует с вашими собственными правами: он видит то, что видите вы, и может делать то, что можете вы, и не более. Всё, что изменяет данные, только предлагается; вы проверяете это, и платформа просит подтверждения перед выполнением.\n\nВаши чаты сохраняются как элементы, доступные только вам: откройте чат снова, переименуйте или удалите его. Ассистент также доступен в верхней панели в виде боковой панели на любой странице.\n\nТе же инструменты предлагаются внешним ИИ-клиентам (например, Claude Desktop) через сервер MCP. В разделе «Токены» вы создаёте персональный токен доступа, только для чтения, пока вы не включите запись, и копируете параметры подключения.\n\nАдминистратор задаёт языковую модель (Anthropic, OpenAI или совместимый с OpenAI сервер, например Ollama) в разделе Система › ИИ-ассистент; если это разрешено, менеджер организации может подключить для организации собственный ключ."

