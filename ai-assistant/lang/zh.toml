name = "AI 助手"
description = "可以与之对话的助手,用于分析数据、读取 KPI、配置平台并在应用中创建项目,支持保存对话,并提供面向外部 AI 客户端的 MCP 服务器"
label = "AI 助手"
details = "用自己的话提问:我的组织里发生了什么、哪些任务已延期、用这份会议纪要创建一条笔记。助手使用各应用提供的工具,并始终以你自己的权限行事:你能看到的它能看到,你能做的它能做,仅此而已。任何会更改数据的操作都只是提出建议;你先审阅,平台会在执行前请你确认。\n\n你的对话会保存为项目,仅你自己可见:可以重新打开、重命名或删除对话。助手也可以在任意页面通过顶部栏以侧边面板的形式使用。\n\n同样的工具也通过 MCP 服务器提供给外部 AI 客户端(例如 Claude Desktop)。在“令牌”中创建个人访问令牌(除非开启写入,否则为只读),并复制连接设置。\n\n管理员在“系统 › AI 助手”中设置语言模型(Anthropic、OpenAI,或 Ollama 等与 OpenAI 兼容的服务器);如果允许,组织管理员可以为组织自带密钥。"

