label = "Sondages"
fields = { question = "Question", details = "Détails", options = "Options", multiple = "Plusieurs choix possibles", hide_voters = "Masquer qui a voté", results = "Afficher les résultats", closes_on = "Se termine le", closed = "Clos" }
options.results = { always = "toujours", after_vote = "après le vote", after_close = "après la clôture" }

