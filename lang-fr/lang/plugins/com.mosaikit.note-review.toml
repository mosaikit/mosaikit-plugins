details = "Ajoute un onglet Révision aux notes de l’application Notes. La personne qui révise marque une note comme révisée, avec un commentaire facultatif ; l’onglet montre qui l’a fait, quand, et l’historique des révisions.\n\nUne extension : elle ne fonctionne que là où Notes est installé, et sa permission décide qui peut réviser."
