name = "Calendrier"
description = "L'agenda de l'équipe : vues par mois, semaine et jour, événements avec personnes invitées, répétitions et les échéances de vos tâches"
label = "Calendrier"
details = "Rédigez un événement avec son jour, son heure et une répétition (chaque jour, semaine, mois ou année), invitez des personnes de votre organisation et voyez tout dans une vue par mois, semaine ou jour. Les invités répondent oui, peut-être ou non, et chacun voit qui vient. Les heures sont des heures locales, écrites exactement comme vous les saisissez, sauf si vous donnez un fuseau horaire à l'événement : il s'affiche alors à la bonne heure où que se trouve chaque personne. Dans une série qui se répète, vous pouvez modifier ou supprimer une seule occurrence.\n\nLes tâches ouvertes ayant une échéance apparaissent à côté des événements (vous pouvez les masquer), de sorte que échéances et réunions sont au même endroit. Un événement est un élément de la plateforme : partagez-le avec les invités pour qu'ils le voient et répondent, et téléchargez-le comme fichier .ics pour l'ajouter à un autre calendrier."

