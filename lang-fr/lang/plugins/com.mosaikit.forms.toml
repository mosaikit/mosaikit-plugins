name = "Formulaires"
description = "Créez un formulaire, partagez un lien public pour recueillir les réponses de n'importe qui sans compte et consultez les réponses dans un tableau ou un CSV"
label = "Formulaires"
details = "Créez un formulaire comptant jusqu'à 30 champs (une ligne de texte, un texte long, un choix, plusieurs choix, un nombre, une date ou une adresse e-mail), indiquez lesquels sont obligatoires et partagez-le : avec vos collègues, qui répondent dans la plateforme, ou avec un lien public que n'importe qui peut ouvrir et remplir sans compte.\n\nFixez la date de clôture du formulaire et le nombre maximal de réponses. Les réponses vont dans un tableau avec le décompte par option, et vous pouvez les exporter en CSV ou supprimer une réponse, par exemple un spam. Un visiteur ne voit jamais les réponses des autres, ni leur nombre.\n\nLe lien public nécessite la politique du tenant « Commandes publiques », que le Tenant Manager active. Un formulaire est un élément de la plateforme : partagez-le avec des personnes ou des groupes (lecture pour le remplir, écriture pour voir les réponses et le modifier) et tout ce que vous savez déjà sur le partage, la recherche et la corbeille s'applique."

