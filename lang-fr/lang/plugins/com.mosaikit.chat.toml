name = "Chat"
description = "Chat comme Microsoft Teams : chats individuels et de groupe avec présence, accusés de lecture, réactions, mentions, fichiers et appels"
label = "Chat"
details = "Discutez avec vos collègues comme dans Microsoft Teams : chats individuels et de groupe, une liste des messages non lus, des chats épinglés et en sourdine, qui est en ligne, qui est en train d’écrire et qui a vu votre message.\n\nÉcrivez avec mise en forme, mentionnez des personnes avec @, marquez un message comme Important ou Urgent, répondez avec une citation, réagissez avec un emoji, épinglez un message, joignez des fichiers depuis votre appareil ou depuis Documents et recherchez ce qui a été dit. Les boutons Appeler et Vidéo lancent un appel de groupe dans le chat, et l’appel reste dans la conversation avec qui a rejoint et combien de temps il a duré.\n\nUn chat est privé pour ses participants : il est partagé avec chacun et n’importe qui peut ajouter des personnes (avec ou sans l’historique précédent). L’historique qu’un nouvel arrivant ne voit pas est masqué par la page, pas par la plateforme. Les canaux des versions précédentes sont toujours là, dans Canaux.\n\nCe que demande le plugin : trouver les personnes de votre organisation avec qui discuter (annuaire), les prévenir (notifications), afficher le service d’appel (meet.jit.si) avec caméra et micro, et lire et ajouter des fichiers dans Documents pour les pièces jointes."

