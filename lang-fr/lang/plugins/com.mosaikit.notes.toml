name = "Notes"
description = "Notes personnelles, partageables avec des collègues et des groupes"
label = "Notes"
details = "Écrivez des notes comme des post-it de couleur avec titre, texte et étiquettes personnelles, changez leur taille, gardez-les privées ou partagez-les avec des collègues et des groupes.\n\nChaque note a son propre niveau de partage, un lien public quand il le faut et une place dans la recherche de la plateforme.\n\nLorsque l’administrateur a configuré un service de traduction (Système › Clés de services externes), une note se traduit dans une autre langue en un clic."
