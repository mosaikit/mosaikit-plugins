name = "问卷"
description = "由共享对象回答的一系列问题，按问题统计结果，并支持计分测验"
label = "问卷"
details = "创建最多包含 40 个问题的问卷（单选、多选、自由文本或 1 到 5 的量表），共享后可按问题查看结果：每个选项一个条形，量表显示平均值，并列出文本回答。每人只能回答一次，结果可导出为 CSV。问题可以设为仅在前面的回答符合条件时才显示，匿名问卷不会将姓名与回答一起保存。\n\n在测验模式下，回答会计分：标记正确选项和每题分值，设定及格线，每个人都能看到自己的得分以及是否通过；正确和错误的答案仅在提交后显示。\n\n问卷是平台中的一个项目：可以共享给个人或群组（读取权限可作答，写入权限可查看全部结果并编辑），你已熟悉的共享、搜索和回收站功能同样适用。"

[resources.surveys]
label = "问卷"
fields = { title = "标题", intro = "简介", questions = "问题", quiz = "测验（计分）", pass_percent = "及格线（%）", closes_on = "截止日期", closed = "已关闭", anonymous = "匿名" }

[kpi.kpi_surveys_status]
label = "问卷状态"
columns = { surveys = "问卷", open_surveys = "进行中", responses = "回答" }
