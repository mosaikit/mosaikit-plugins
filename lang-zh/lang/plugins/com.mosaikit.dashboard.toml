name = "仪表板"
description = "一个小组件页面，汇总各个应用中与你相关的内容：未完成的任务、待确认的通知、待投票的投票、待决定的请求"
label = "仪表板"
details = "用工作空间中各个应用提供的小组件组合出一个页面：你未完成和已逾期的任务、等待你确认的通知、待投票的投票、待决定的请求、你最近的笔记。每个小组件只显示你自己的数据，并遵循其来源应用的访问规则。\n\n看板是一份按你选定顺序排列的小组件列表，可分为一列、两列或三列。你可以保存任意数量的看板，一个用于早晨，一个用于某个项目，还可以与同事共享看板。\n\n应用会自行向仪表板添加小组件：这里无需任何配置，而且某个小组件出错也不会影响其他小组件的显示。"

