name = "日历"
description = "团队日程：按月、周、日查看，支持邀请他人的活动、重复以及任务的截止日期"
label = "日历"
details = "创建一个活动，设定日期、时间和重复方式（每天、每周、每月或每年），邀请组织中的成员，并以月、周或日视图查看全部内容。受邀者可回复参加、可能参加或不参加，所有人都能看到谁会出席。时间按本地时间原样填写，除非你为活动指定时区：这样无论每个人身在何处，都会在正确的时刻显示。在重复系列中，你可以更改或删除其中的某一次。\n\n带截止日期的未完成任务会显示在活动旁边（可以关闭显示），这样截止期限和会议就在同一个地方。活动是平台中的一个条目：共享给受邀者，他们就可以查看并回复，也可以下载为 .ics 文件，添加到其他日历。"

