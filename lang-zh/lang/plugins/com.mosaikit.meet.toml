details = "开设会议室，与同事面对面交流：摄像头、麦克风、屏幕共享，以及通话中的聊天。\n\n会议室是平台中的一个项目：与可以加入的个人或群组共享（能看到会议室的人即可加入）。会议室在页面内打开，并显示谁正在其中；通话由 Jitsi Meet 服务完成，因此任何视频都不会经过 Mosaikit。\n\n首次使用时，浏览器会请求摄像头和麦克风权限。"

