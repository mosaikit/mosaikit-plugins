name = "表单"
description = "创建表单，分享公开链接，无需账号即可收集任何人的回答，并在表格或 CSV 中查看回答"
label = "表单"
details = "创建最多包含 30 个字段的表单（单行文本、长文本、单选、多选、数字、日期或电子邮件地址），标记哪些为必填，然后分享：可分享给同事，他们在平台内作答；也可分享公开链接，任何人无需账号即可打开并填写。\n\n设置表单的截止时间和回答数量上限。回答会汇总到表格中，并显示各选项的计数，你可以将其导出为 CSV，或删除某条回答，例如垃圾回答。访客永远看不到他人的回答，也看不到回答的数量。字段可以设为仅在前面的回答符合条件时才显示，匿名表单不会将姓名与回答一起保存。\n\n公开链接需要租户策略“公开命令”，由 Tenant Manager 启用。表单是平台中的一个项目：可分享给个人或群组（读取权限用于填写，写入权限用于查看回答和编辑），你已熟悉的分享、搜索和回收站规则同样适用。"

[resources.forms]
label = "表单"
fields = { title = "标题", intro = "简介", fields = "字段", open = "开放（接受回答）", closes_on = "截止日期", max_answers = "回答数量上限", thanks = "感谢信息", anonymous = "匿名" }

