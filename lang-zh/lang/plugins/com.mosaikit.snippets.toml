label = "片段"
details = "随手备好团队反复使用的文本和代码:标题、文本或代码本身、类型(纯文本、shell、SQL、JSON、JavaScript、Python、Rust、Markdown)和标签。可通过搜索、类型或标签找到片段,并一键复制到剪贴板。\n\n片段是平台中的一个元素:可以与个人或群组共享(读取权限用于使用,写入权限用于编辑),您已熟悉的共享、搜索和回收站功能同样适用。"

