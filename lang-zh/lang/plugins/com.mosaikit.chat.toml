name = "聊天"
description = "类似 Microsoft Teams 的聊天：单人和群聊，支持在线状态、已读回执、表情回应、提及、文件和通话"
label = "聊天"
details = "像在 Microsoft Teams 中一样与同事交流：单人聊天和群聊、带未读数的列表、置顶和静音的聊天，以及谁在线、谁正在输入、谁已查看你的消息。\n\n可以使用格式书写，用 @ 提及他人，将消息标记为重要或紧急，引用回复，用表情回应，置顶消息，从设备或文档附加文件，并搜索聊过的内容。“通话”和“视频”按钮会在聊天中发起群组通话，通话会保留在对话中，并记录谁加入以及持续了多久。\n\n聊天仅对参与者私有：它会与每位参与者共享，聊天中的任何人都可以添加人员（可包含或不包含之前的记录）。新成员看不到的记录由页面隐藏，而不是由平台隐藏。早期版本的频道仍然保留，位于“频道”中。\n\n该插件需要的权限：查找你所在组织中可以聊天的人员（通讯录），通知他们（通知），显示通话服务（meet.jit.si）并使用摄像头和麦克风，以及在文档中读取和添加文件作为附件。"

