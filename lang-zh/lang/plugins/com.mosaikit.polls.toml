name = "投票"
description = "向一组人提出一个快速问题：单选或多选，可设截止日期，实名或匿名投票，结果实时显示"
label = "投票"
details = "向共享投票的人提出一个快速问题：写下问题和两到十二个选项，选择单选或多选，需要时设置截止日期，并决定是否显示投票人姓名。\n\n有访问权限的人只需一次点击即可投票，投票开放期间还可以更改自己的选择。结果以条形图显示，其他人投票时会实时变化；你可以选择始终显示、投票后显示，或仅在投票关闭后显示。\n\n投票是平台中的一个项目：可以共享给个人或群组（只需读取权限即可投票），你已熟悉的共享、搜索和回收站功能同样适用。"

