id = "com.mosaikit.lang-zh"
name = "Chinese (中文)"
version = "0.1.2"
kind = "language"
icon = "languages"
author = "Mosaikit"
license = "Apache-2.0"
details = "Chinese interface for the shell and for the names of the official plugins (their fields, options and indicators). Texts inside the pages of a plugin are drawn by the plugin itself: where it has no Chinese text they stay in English.\n\nTo add another language, copy this plugin."
homepage = "https://example.org/mosaikit/plugins/lang-zh"
description = "Chinese interface: the shell and the manifest texts of the official plugins"

[requires]
mosaikit = ">=1.0, <2"
api = 1

[contribution]
icon = "🌐"
label = "中文"

# the language this plugin adds: the code and its name in that language
[language]
code = "zh"
name = "中文"

[i18n.it]
details = "Interfaccia in cinese per la shell e per i nomi dei plugin ufficiali (campi, opzioni e indicatori). I testi dentro le pagine di un plugin li disegna il plugin stesso: dove non ha un testo in cinese restano in inglese.\n\nPer aggiungere un’altra lingua, copia questo plugin."
name = "Cinese (中文)"
description = "Interfaccia in cinese: la shell e i testi di manifest dei plugin ufficiali"
label = "中文"
