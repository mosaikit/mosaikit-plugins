id = "com.mosaikit.maps"
name = "Maps"
version = "0.5.1"
kind = "app"
# icon of the shell (Lucide); contribution.icon stays for older hosts
icon = "map"
description = "Catalog of GeoLibre maps: configuration saved in the .geolibre.json project"
author = "Mosaikit"
license = "Apache-2.0"

[contribution]
icon = "🗺"
label = "Maps"

[[resources]]
name = "maps"
label = "Maps"
title_field = "name"
fields = [
  { key = "name", label = "Name", kind = "text", required = true },
  { key = "description", label = "Description", kind = "text", multiline = true },
  { key = "config", label = "Configuration (.geolibre.json)", kind = "text", multiline = true, hidden = true },
  { key = "layers", label = "Layers", kind = "number", hidden = true },
]

[ui]
entry = "index.html"
public_view = "public.html"

[permissions]
hooks = ["maps"]
frame_src = ["https://web.geolibre.app"]

[[kpi]]
view = "kpi_maps"
label = "Maps and layers"

# Italian translation of the texts above (missing keys fall back to English).
[i18n.it]
name = "Mappe"
description = "Catalogo di mappe GeoLibre: configurazione salvata nel progetto .geolibre.json"
label = "Mappe"

[i18n.it.resources.maps]
label = "Mappe"
fields = { name = "Nome", description = "Descrizione", config = "Configurazione (.geolibre.json)", layers = "Livelli" }

[i18n.it.kpi.kpi_maps]
label = "Mappe e livelli"
columns = { maps = "mappe", layers = "livelli" }
