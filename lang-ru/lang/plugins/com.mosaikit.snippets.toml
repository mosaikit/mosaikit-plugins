name = "Фрагменты"
description = "Общая коллекция повторно используемых текстов и фрагментов кода с метками, которые копируются одним щелчком"
label = "Фрагменты"
details = "Держите под рукой тексты и код, которые ваша команда использует снова и снова: заголовок, сам текст или код, тип (простой текст, shell, SQL, JSON, JavaScript, Python, Rust, Markdown) и метки. Находите фрагмент через поиск, по типу или по метке и копируйте его в буфер обмена одним щелчком.\n\nФрагмент — это элемент платформы: делитесь им с людьми или группами (чтение — чтобы использовать его, запись — чтобы редактировать), и на него распространяется всё, что вы уже знаете об общем доступе, поиске и корзине."

[resources.snippets]
label = "Фрагменты"
fields = { title = "Заголовок", body = "Содержимое", kind = "Тип", tags = "Метки" }
options.kind = { text = "текст", shell = "shell", sql = "SQL", json = "JSON", javascript = "JavaScript", python = "Python", rust = "Rust", markdown = "Markdown", other = "другое" }

[kpi.kpi_snippets_by_kind]
label = "Фрагменты по типам"
columns = { kind = "тип", snippets = "фрагменты" }
