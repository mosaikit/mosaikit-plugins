name = "Панель"
description = "Страница из виджетов, которая показывает важное для вас в приложениях: открытые задачи, уведомления для подтверждения, опросы для голосования, запросы для решения"
label = "Панель"
details = "Составьте страницу из виджетов, которые предлагают приложения вашего рабочего пространства: ваши открытые и просроченные задачи, уведомления, ожидающие вашего подтверждения, опросы для голосования, запросы для решения, ваши недавние заметки. Каждый виджет показывает только ваши данные по правилам доступа приложения, из которого он пришёл.\n\nДоска — это список виджетов в выбранном вами порядке, в один, два или три столбца. Храните сколько угодно досок: одну на утро, другую для проекта, и делитесь доской с коллегой.\n\nПриложение само добавляет виджет на Панель: настраивать здесь ничего не нужно, а виджет, который дал сбой, никогда не скрывает остальные."

