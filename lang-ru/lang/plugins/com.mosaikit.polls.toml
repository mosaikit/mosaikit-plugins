name = "Опросы"
description = "Быстрый вопрос группе: один или несколько вариантов, необязательный срок, открытое или скрытое голосование и результаты в реальном времени"
label = "Опросы"
details = "Задайте быстрый вопрос тем, с кем вы делитесь опросом: напишите вопрос и от двух до двенадцати вариантов, выберите один или несколько вариантов ответа, при желании задайте дату закрытия и решите, будут ли указаны имена голосующих.\n\nВсе, у кого есть доступ, голосуют одним щелчком и могут изменить свой голос, пока опрос открыт. Результаты отображаются в виде полос, которые меняются в реальном времени, пока голосуют другие; вы выбираете, показывать ли их всегда, после голосования или только после закрытия опроса.\n\nОпрос является элементом платформы: делитесь им с людьми или группами (для голосования достаточно доступа на чтение), и на него распространяется всё, что вы уже знаете об общем доступе, поиске и корзине."

[resources.polls]
label = "Опросы"
fields = { question = "Вопрос", details = "Подробности", options = "Варианты", multiple = "Более одного варианта", hide_voters = "Скрыть, кто голосовал", results = "Показывать результаты", closes_on = "Закрывается", closed = "Закрыт" }
options.results = { always = "всегда", after_vote = "после голосования", after_close = "после закрытия" }

[kpi.kpi_polls_status]
label = "Состояние опросов"
columns = { total = "всего", open_polls = "открытые", closed_polls = "закрытые" }
