name = "Анкеты"
description = "Серии вопросов, на которые отвечают люди, с которыми вы поделились анкетой, с результатами по каждому вопросу и тестами с баллами"
label = "Анкеты"
details = "Создайте анкету до 40 вопросов (один ответ, несколько ответов, свободный текст или шкала от 1 до 5), поделитесь ею и смотрите результаты по каждому вопросу: полоса для каждого варианта, среднее значение по шкале и текстовые ответы. Каждый человек отвечает один раз, а результаты можно экспортировать в CSV. Вопрос можно показывать только тогда, когда совпадает один из прежних ответов, а анонимная анкета не сохраняет имён вместе с ответами.\n\nВ режиме теста ответы оцениваются баллами: отметьте правильные варианты и баллы за каждый вопрос, задайте проходной балл, и каждый увидит свой результат и сдал ли он тест; правильные и неправильные ответы показываются только после отправки.\n\nАнкета является элементом платформы: делитесь ею с людьми или группами (чтение — чтобы отвечать, запись — чтобы видеть все результаты и редактировать её), и на неё распространяется всё, что вы уже знаете об общем доступе, поиске и корзине."

[resources.surveys]
label = "Анкеты"
fields = { title = "Название", intro = "Введение", questions = "Вопросы", quiz = "Тест (с баллами)", pass_percent = "Проходной балл (%)", closes_on = "Закрывается", closed = "Закрыта", anonymous = "Анонимная" }

[kpi.kpi_surveys_status]
label = "Состояние анкет"
columns = { surveys = "анкеты", open_surveys = "открытые", responses = "ответы" }
