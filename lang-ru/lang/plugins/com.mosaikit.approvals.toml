name = "Согласования"
description = "Попросите одного или нескольких человек одобрить или отклонить запрос и сохраняйте историю того, кто, что и когда решил"
label = "Согласования"
details = "Напишите запрос, выберите тех, кто должен принять решение, и способ: достаточно одного одобрения, должны одобрить все или по очереди в том порядке, в котором вы их перечислите. Каждый согласующий одобряет или отклоняет с комментарием один раз, и решение окончательное.\n\nСостояние запроса (на рассмотрении, одобрен, отклонён или отменён) всегда вычисляется по решениям, и все видят, кто, что и когда решил. Тем, кто принимает решения, показывается значок с числом ожидающих их запросов.\n\nЗапрос является элементом платформы: делитесь им с согласующими (для принятия решения им нужен доступ на чтение), и на него распространяется всё, что вы уже знаете об общем доступе, поиске и корзине."

[resources.requests]
label = "Запросы"
fields = { title = "Название", details = "Подробности", amount = "Сумма", mode = "Режим", approvers = "Согласующие", cancelled = "Отменён" }
options.mode = { any = "достаточно одного", all = "все", sequence = "по очереди" }

[kpi.kpi_requests_status]
label = "Состояние запросов"
columns = { requests = "запросы", cancelled_requests = "отменённые", decided_requests = "хотя бы с одним решением" }
