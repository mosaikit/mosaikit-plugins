name = "Формы"
description = "Создайте форму, поделитесь публичной ссылкой, чтобы собирать ответы от любого человека без учётной записи, и просматривайте ответы в таблице или в CSV"
label = "Формы"
details = "Создайте форму, содержащую до 30 полей (строка текста, длинный текст, один вариант, несколько вариантов, число, дата или адрес электронной почты), отметьте обязательные поля и поделитесь ею: с коллегами, которые отвечают внутри платформы, или по публичной ссылке, которую любой человек может открыть и заполнить без учётной записи.\n\nЗадайте срок закрытия формы и максимальное число ответов. Ответы попадают в таблицу с подсчётом по вариантам, и вы можете экспортировать их в CSV или удалить ответ, например спам. Посетитель никогда не видит ответы других и не знает, сколько их.\n\nДля публичной ссылки нужна политика тенанта «Публичные команды», которую включает Tenant Manager. Форма является элементом платформы: делитесь ею с людьми или группами (чтение для заполнения, запись для просмотра ответов и редактирования), и на неё распространяется всё, что вы уже знаете об общем доступе, поиске и корзине."

