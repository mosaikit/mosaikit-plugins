details = "Добавляет вкладку «Проверка» к заметкам приложения «Заметки». Проверяющий отмечает заметку как проверенную, при желании с комментарием; вкладка показывает, кто это сделал, когда, и историю проверок.\n\nЭто расширение: оно работает только там, где установлены «Заметки», а его право определяет, кто может проверять."
