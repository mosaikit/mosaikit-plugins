name = "Проекты"
description = "Составьте план для набора задач: колонки доски, вехи с датами и спринты, с индикатором выполнения"
label = "Проекты"
details = "Планируйте работу над релизом, стройкой или кампанией. В проекте есть колонки доски, вехи с датой и спринты (временные отрезки), а также показано, сколько его задач выполнено.\n\nЗадачи остаются задачами: они принадлежат плагину «Задачи», который должен быть установлен, а проект — это название, записанное в их поле «Проект». Вы видите и меняете только те задачи, которые можете видеть и менять в «Задачах».\n\nПроект — это элемент платформы: делитесь им с людьми или группами (чтение — чтобы следить за ним, запись — чтобы упорядочивать доску), и на него распространяется всё, что вы уже знаете об общем доступе, поиске и корзине."

