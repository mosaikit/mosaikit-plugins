label = "Встречи"
details = "Откройте комнату и встречайтесь с коллегами лицом к лицу: камера, микрофон, демонстрация экрана и чат внутри звонка.\n\nКомната — элемент платформы: делитесь ею с людьми или группами, которые могут войти (кто видит комнату, тот может войти). Комната открывается внутри страницы и показывает, у кого она открыта; звонок идёт через сервис Jitsi Meet, поэтому видео не проходит через Mosaikit.\n\nПри первом входе браузер запросит доступ к камере и микрофону."

