name = "Объявления"
description = "Доска объявлений: публикуйте объявления с уровнем и сроком действия и смотрите, кто подтвердил прочтение"
label = "Объявления"
details = "Опубликуйте объявление для людей, которым оно адресовано: заголовок, текст в Markdown, уровень (информация, важное или срочное) и срок действия. Срочные и закреплённые объявления остаются вверху.\n\nЕсли объявление требует подтверждения, каждый читатель подтверждает его одним щелчком, а автор видит, кто и когда это сделал.\n\nОбъявление — это элемент платформы: делитесь им с людьми или группами (чтение — чтобы следить за ним, запись — чтобы редактировать), и на него распространяется всё, что вы уже знаете об общем доступе, поиске и корзине."

[resources.notices]
label = "Объявления"
fields = { title = "Заголовок", body = "Текст", level = "Уровень", starts_on = "Действует с", ends_on = "Действует до", pinned = "Закреплено", needs_ack = "Требовать подтверждения" }
options.level = { info = "информация", important = "важное", urgent = "срочное" }

[kpi.kpi_notices_status]
label = "Состояние объявлений"
columns = { published = "опубликовано", in_force = "действуют", urgent = "срочные действующие", pinned = "закреплено" }
