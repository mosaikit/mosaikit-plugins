name = "Календарь"
description = "Расписание команды: просмотр по месяцам, неделям и дням, события с приглашёнными, повторения и сроки ваших задач"
label = "Календарь"
details = "Создайте событие с днём, временем и повторением (каждый день, неделю, месяц или год), пригласите людей из вашей организации и смотрите всё в виде месяца, недели или дня. Приглашённые отвечают «да», «возможно» или «нет», и все видят, кто придёт. Время записывается как местное, ровно так, как вы его вводите: пересчёта часовых поясов нет, поэтому встреча в 09:30 для всех проходит в 09:30.\n\nОткрытые задачи со сроком выполнения отображаются рядом с событиями (их можно скрыть), так что сроки и встречи собраны в одном месте. Событие — это элемент платформы: поделитесь им с приглашёнными, чтобы они могли его увидеть и ответить, и скачайте его как файл .ics, чтобы добавить в другой календарь."

