name = "Закладки"
description = "Общая коллекция веб-ссылок с заметкой и метками, чтобы быстро находить их снова и делиться ими с людьми и группами"
label = "Закладки"
details = "Сохраняйте ссылки, к которым ваша команда возвращается часто: у каждой закладки есть заголовок, адрес, заметка и метки. Ищите по любому из этих полей, фильтруйте по метке, отмечайте избранным то, чем пользуетесь чаще всего, и открывайте или копируйте ссылку одним щелчком.\n\nЗакладка — это элемент платформы: делитесь ею с людьми или группами (чтение — чтобы видеть её, запись — чтобы редактировать), и на неё распространяется всё, что вы уже знаете об общем доступе, поиске и корзине. Принимаются только адреса http и https, и с сохранённых сайтов ничего не загружается."

[resources.bookmarks]
label = "Закладки"
fields = { title = "Заголовок", url = "Адрес", note = "Заметка", tags = "Метки", favorite = "Избранное" }

