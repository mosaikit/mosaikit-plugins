name = "Чат"
description = "Чат как в Microsoft Teams: личные и групповые чаты с присутствием, уведомлениями о прочтении, реакциями, упоминаниями, файлами и звонками"
label = "Чат"
details = "Общайтесь с коллегами так же, как в Microsoft Teams: личные и групповые чаты, список со счётчиками непрочитанных, закреплённые чаты и чаты без уведомлений, кто в сети, кто печатает и кто просмотрел ваше сообщение.\n\nПишите с форматированием, упоминайте людей через @, помечайте сообщение как «Важно» или «Срочно», отвечайте цитатой, ставьте реакции эмодзи, закрепляйте сообщения, прикрепляйте файлы с устройства или из Документов и ищите нужное. Кнопки «Звонок» и «Видео» запускают групповой звонок в чате, а сам звонок остаётся в беседе с указанием, кто присоединился и сколько он длился.\n\nЧат закрыт для посторонних: им делятся с каждым участником, и любой участник может добавлять людей (с прежней историей или без неё). Историю, которую новичок не видит, скрывает страница, а не платформа. Каналы из прежних версий никуда не делись, они находятся в разделе «Каналы».\n\nЧто запрашивает плагин: искать людей вашей организации для общения (каталог), уведомлять их (уведомления), показывать сервис звонков (meet.jit.si) с камерой и микрофоном, а также читать и добавлять файлы в Документах для вложений."

