name = "Доска"
description = "Общая доска для стикеров, фигур, стрелок и рисунков, которую одновременно редактируют несколько человек"
label = "Доска"
details = "Свободная доска для мозговых штурмов, семинаров и схем, которые рисуют вместе во время звонка: стикеры, прямоугольники, эллипсы, текст, стрелки, рамки, объединяющие то, что внутри них, и рисование от руки, с палитрой цветов, шаблонами для начала работы (канбан, SWOT, ретроспектива, мозговой штурм), отменой и повтором, масштабированием и прокруткой и экспортом в PNG или SVG.\n\nКаждый, у кого открыта доска, видит изменения и указатели других участников в реальном времени. Изменения сохраняют в доске те, кто может её редактировать; тот, у кого только чтение, следит в прямом эфире, но ничего менять не может.\n\nДоска — это элемент платформы: делитесь ею с людьми или группами (чтение — чтобы смотреть, запись — чтобы рисовать на ней), и на неё распространяется всё, что вы уже знаете об общем доступе, поиске и корзине."

