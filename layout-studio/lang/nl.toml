details = "Een indigo balk zoals die van Teams, een grijze zijbalk met de apps in groepen die tonen hoeveel apps ze bevatten, één pictogram per groep als hij is ingeklapt, een wit werkgebied en zachte schaduwen. De apps hebben 3D-pictogrammen, in lichte en donkere modus."
