id = "com.mosaikit.whiteboard"
name = "Whiteboard"
version = "0.1.1"
kind = "app"
# icon of the shell (Lucide); contribution.icon stays for older hosts
icon = "presentation"
description = "A shared board for sticky notes, shapes, arrows and drawing, edited live by several people"
author = "Mosaikit"
license = "Apache-2.0"
details = "A free-form board for brainstorming, workshops and diagrams drawn together in a call: sticky notes, rectangles, ellipses, text, arrows and freehand drawing, with a colour palette, undo and redo, zoom and pan, and export as PNG or SVG.\n\nEveryone who has the board open sees the changes and the pointers of the others as they happen. Changes are saved in the board by the people who can edit it; people with read access follow along live but cannot change anything.\n\nA board is an item of the platform: share it with people or groups (read to watch it, write to draw on it) and everything you already know about sharing, search and the trash applies."
screenshots = ["board.svg", "list.svg"]
homepage = "https://example.org/mosaikit/plugins/whiteboard"

[requires]
mosaikit = ">=1.0, <2"
api = 1

[contribution]
icon = "🧑‍🏫"
label = "Whiteboard"

[[resources]]
name = "whiteboards"
label = "Whiteboards"
title_field = "title"
fields = [
  { key = "title", label = "Title", kind = "text", required = true },
  { key = "snapshot", label = "Drawing", kind = "text", hidden = true },
  { key = "bg", label = "Background", kind = "choice", options = ["plain", "dots", "grid"] },
]

[ui]
entry = "index.html"

[permissions]
hooks = ["whiteboards"]
# the people who have a board open exchange the changes on a live channel (the kernel only relays)
realtime = true

[[kpi]]
view = "kpi_whiteboards_status"
label = "Status of the whiteboards"

# Italian translation of the texts above (missing keys fall back to English).
[i18n.it]
details = "Una lavagna libera per brainstorming, workshop e diagrammi disegnati insieme in una chiamata: note adesive, rettangoli, ellissi, testo, frecce e disegno a mano libera, con una tavolozza di colori, annulla e ripeti, zoom e spostamento, ed esportazione in PNG o SVG.\n\nChiunque abbia la lavagna aperta vede in tempo reale le modifiche e i puntatori degli altri. Le modifiche vengono salvate nella lavagna da chi può modificarla; chi ha solo la lettura segue dal vivo ma non può cambiare nulla.\n\nUna lavagna è un elemento della piattaforma: condividila con persone o gruppi (lettura per guardarla, scrittura per disegnarci sopra) e vale tutto ciò che sai già su condivisione, ricerca e cestino."
name = "Lavagna"
description = "Una lavagna condivisa per note adesive, forme, frecce e disegno, modificata dal vivo da più persone"
label = "Lavagna"

[i18n.it.resources.whiteboards]
label = "Lavagne"
fields = { title = "Titolo", snapshot = "Disegno", bg = "Sfondo" }
options.bg = { plain = "liscio", dots = "puntinato", grid = "a griglia" }

[i18n.it.kpi.kpi_whiteboards_status]
label = "Stato delle lavagne"
columns = { whiteboards = "lavagne" }
