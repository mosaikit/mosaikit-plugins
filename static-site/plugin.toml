id = "com.mosaikit.static-site"
name = "Sites"
version = "0.11.1"
kind = "app"
# icon of the shell (Lucide); contribution.icon stays for older hosts
icon = "grid"
description = "Publishes static sites from zip archives, shareable and with public links"
author = "Mosaikit"
license = "Apache-2.0"
details = "Publish a static site from a zip archive.\n\nEvery site can be shared with colleagues and groups, and opened to anyone with a public link that you can revoke at any time. Sites are served from a separate origin, so their scripts never reach the platform.\n\nA link to an outside site belongs in Bookmarks, which can show it inside the page. Sites that an earlier version made by web address stay here, open in a new tab, and can be downloaded in the import format of Bookmarks."
screenshots = ["sites.webp", "site.webp"]
homepage = "https://example.org/mosaikit/plugins/static-site"

[requires]
mosaikit = ">=1.0, <2"
api = 1

[contribution]
icon = "▦"
label = "Sites"

[[resources]]
name = "sites"
label = "Sites"
title_field = "name"
fields = [
  { key = "name", label = "Name", kind = "text", required = true },
  { key = "description", label = "Description", kind = "text", multiline = true },
  { key = "zip_name", label = "Uploaded zip", kind = "text", hidden = true },
  { key = "entry", label = "Start page", kind = "text", hidden = true },
  { key = "files", label = "Files", kind = "number", hidden = true },
  { key = "size", label = "Size (bytes)", kind = "number", hidden = true },
  # kept for the sites that an earlier version made by web address (no longer created)
  { key = "url", label = "Web address", kind = "text", hidden = true, search = true },
  { key = "framable", label = "May be framed", kind = "text", hidden = true },
  { key = "thumbnail", label = "Thumbnail", kind = "text", hidden = true },
]

[ui]
entry = "index.html"

[permissions]
content = true

[[kpi]]
view = "kpi_sites"
label = "Published sites"

# Italian translation of the texts above (missing keys fall back to English).
[i18n.it]
details = "Pubblica un sito statico da un archivio zip.\n\nOgni sito può essere condiviso con colleghi e gruppi e aperto a chiunque con un link pubblico che puoi revocare in qualsiasi momento. I siti sono serviti da un’origine separata, quindi i loro script non raggiungono mai la piattaforma.\n\nUn link a un sito esterno va nei Segnalibri, che può mostrarlo dentro la pagina. I siti che una versione precedente creava da un indirizzo web restano qui, si aprono in una nuova scheda e si possono scaricare nel formato di importazione dei Segnalibri."
name = "Siti"
description = "Pubblica siti statici da archivi zip, condivisibili e con link pubblici"
label = "Siti"

[i18n.it.resources.sites]
label = "Sito"
fields = { name = "Nome", description = "Descrizione", zip_name = "Zip caricato", entry = "Pagina iniziale", files = "File", size = "Dimensione (byte)", url = "Indirizzo web", framable = "Incorporabile", thumbnail = "Miniatura" }

[i18n.it.kpi.kpi_sites]
label = "Siti pubblicati"
columns = { sites = "siti", files = "file", bytes = "byte" }
