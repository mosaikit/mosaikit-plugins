name = "موافقات"
description = "موافقات: اطلب من شخص أو أكثر الموافقة على طلب أو رفضه، واحتفظ بسجل من قرر ماذا ومتى"
label = "موافقات"
details = "اكتب طلباً، واختر الأشخاص الذين يجب أن يقرروا وكيف: تكفي موافقة واحدة، أو يجب أن يوافق الجميع، أو واحداً بعد الآخر بالترتيب الذي تسرد به الأسماء. يوافق كل معتمِد أو يرفض مع تعليق، مرة واحدة فقط، والقرار نهائي.\n\nتُحسب حالة الطلب (قيد الانتظار، أو تمت الموافقة، أو مرفوض، أو ملغى) دائماً انطلاقاً من القرارات، ويرى الجميع من قرر ماذا ومتى. ويرى من عليه أن يقرر عدّاداً بالطلبات التي تنتظره.\n\nالطلب عنصر من عناصر المنصة: شاركه مع المعتمِدين (يحتاجون إلى حق القراءة ليقرروا)، وينطبق عليه كل ما تعرفه عن المشاركة والبحث وسلة المحذوفات."

