label = "الإعلانات"
details = "انشر إعلانًا للأشخاص الذين يتم مشاركته معهم: عنوان، ونص بصيغة Markdown، ومستوى (معلومة أو مهم أو عاجل)، والفترة التي يكون فيها ساريًا. تبقى الإعلانات العاجلة والمثبّتة في الأعلى.\n\nعندما يطلب الإعلان تأكيدًا، يؤكد كل قارئ بنقرة واحدة، ويرى الكاتب من فعل ذلك ومتى.\n\nالإعلان عنصر في المنصة: شاركه مع أشخاص أو مجموعات (القراءة للمتابعة، والكتابة للتعديل)، وينطبق عليه كل ما تعرفه عن المشاركة والبحث وسلة المحذوفات."

