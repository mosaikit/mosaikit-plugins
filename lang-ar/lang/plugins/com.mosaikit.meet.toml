label = "الاجتماعات"
details = "افتح غرفة والتقِ بزملائك وجهًا لوجه: كاميرا وميكروفون ومشاركة الشاشة ودردشة داخل المكالمة.\n\nالغرفة عنصر في المنصة: شاركها مع الأشخاص أو المجموعات الذين يمكنهم الدخول (من يرى الغرفة يمكنه الدخول). تُفتح الغرفة داخل الصفحة وتعرض من فتحها؛ وتجري المكالمة في خدمة Jitsi Meet، لذلك لا يمر أي فيديو عبر Mosaikit.\n\nيطلب منك المتصفح الكاميرا والميكروفون في المرة الأولى."

