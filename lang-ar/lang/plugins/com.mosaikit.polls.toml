name = "تصويتات"
description = "تصويتات: سؤال سريع لمجموعة، باختيار واحد أو متعدد، مع موعد نهائي اختياري، وأصوات معلنة بالاسم أو مخفية، ونتائج مباشرة"
label = "تصويتات"
details = "اطرح سؤالاً سريعاً على الأشخاص الذين تشارك معهم التصويت: اكتب السؤال وما بين خيارين واثني عشر خياراً، واختر بين إجابة واحدة أو عدة إجابات، وحدد تاريخ إغلاق إن أردت، وقرر هل تظهر أسماء المصوّتين.\n\nكل من لديه حق الوصول يصوّت بنقرة واحدة ويستطيع تغيير صوته ما دام التصويت مفتوحاً. تظهر النتائج على شكل أشرطة تتحرك مباشرة أثناء تصويت الآخرين، وأنت تختار هل تُعرض دائماً أو بعد التصويت أو عند إغلاق التصويت فقط.\n\nالتصويت عنصر من عناصر المنصة: شاركه مع أشخاص أو مجموعات (يكفي حق القراءة للتصويت)، وينطبق عليه كل ما تعرفه عن المشاركة والبحث وسلة المحذوفات."

