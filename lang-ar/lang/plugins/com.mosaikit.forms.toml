name = "النماذج"
description = "النماذج: أنشئ نموذجًا، وشارك رابطًا عامًا لجمع الإجابات من أي شخص دون حساب، واقرأ الإجابات في جدول أو في ملف CSV"
label = "النماذج"
details = "أنشئ نموذجًا يضم حتى 30 حقلًا (سطر نصي، أو نص طويل، أو اختيارًا واحدًا، أو عدة اختيارات، أو رقمًا، أو تاريخًا، أو عنوان بريد إلكتروني)، وحدّد الحقول الإلزامية، ثم شاركه: مع زملائك الذين يجيبون داخل المنصة، أو عبر رابط عام يمكن لأي شخص فتحه وملؤه دون حساب.\n\nحدّد موعد إغلاق النموذج والحد الأقصى لعدد الإجابات. تُحفظ الإجابات في جدول يعرض عدد مرات اختيار كل خيار، ويمكنك تصديرها إلى ملف CSV أو حذف إجابة، مثل إجابة غير مرغوبة. لا يرى الزائر إجابات الآخرين أبدًا، ولا عددها. ويمكن إظهار الحقل فقط عندما تطابقه إجابة سابقة، ولا يحتفظ النموذج المجهول بأي اسم مع الإجابات.\n\nيتطلب الرابط العام سياسة المستأجر «الأوامر العامة» التي يفعّلها Tenant Manager. النموذج عنصر من عناصر المنصة: شاركه مع أشخاص أو مجموعات (القراءة لملئه، والكتابة لعرض الإجابات وتعديله)، وينطبق عليه كل ما تعرفه بالفعل عن المشاركة والبحث وسلة المحذوفات."

