name = "المشاريع"
description = "المشاريع: امنح مجموعة من المهام خطة، مع أعمدة اللوحة ومراحل رئيسية بتواريخ وسباقات (Sprints) وشريط تقدم"
label = "المشاريع"
details = "خطط لعمل إصدار أو موقع بناء أو حملة. للمشروع أعمدة لوحة ومراحل رئيسية بتاريخ وسباقات (فترات زمنية)، ويعرض عدد المهام المنجزة منه.\n\nتبقى المهام مهامّ: فهي تتبع إضافة المهام التي يجب أن تكون مثبتة، واسم المشروع هو الاسم المكتوب في حقل المشروع لديها. لا ترى ولا تغيّر إلا المهام التي يحق لك رؤيتها وتغييرها في المهام.\n\nالمشروع عنصر في المنصة: شاركه مع أشخاص أو مجموعات (القراءة لمتابعته والكتابة لتنظيم اللوحة)، وينطبق عليه كل ما تعرفه عن المشاركة والبحث وسلة المحذوفات."

