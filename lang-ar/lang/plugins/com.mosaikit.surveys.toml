name = "استبيانات"
description = "استبيانات: مجموعات من الأسئلة يجيب عنها الأشخاص الذين تُشارك معهم، مع النتائج لكل سؤال واختبارات بدرجات"
label = "استبيانات"
details = "أنشئ استبياناً يضم حتى 40 سؤالاً (إجابة واحدة، أو عدة إجابات، أو نصاً حراً، أو مقياساً من 1 إلى 5)، وشاركه واطّلع على النتائج لكل سؤال: شريط لكل خيار، ومتوسط المقياس، والإجابات النصية. يجيب كل شخص مرة واحدة فقط، ويمكن تصدير النتائج إلى CSV. ويمكن إظهار السؤال فقط عندما تطابقه إجابة سابقة، ولا يحتفظ الاستبيان المجهول بأي اسم مع الإجابات.\n\nفي وضع الاختبار تُحتسب درجات الإجابات: حدد الخيارات الصحيحة ونقاط كل سؤال، وعيّن درجة النجاح، فيرى كل شخص درجته وهل نجح، ولا تظهر الإجابات الصحيحة والخاطئة إلا بعد الإرسال.\n\nالاستبيان عنصر من عناصر المنصة: شاركه مع أشخاص أو مجموعات (القراءة للإجابة، والكتابة لرؤية كل النتائج وتعديله)، وينطبق عليه كل ما تعرفه عن المشاركة والبحث وسلة المحذوفات."

