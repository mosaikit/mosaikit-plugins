label = "الملاحظات"
details = "اكتب ملاحظات كأوراق لاصقة ملونة بعنوان ونص ووسوم خاصة بك، وغيّر حجمها، واحتفظ بها خاصة أو شاركها مع الزملاء والمجموعات.\n\nلكل ملاحظة مستوى مشاركة خاص بها، ورابط عام عند الحاجة، ومكان في بحث المنصة.\n\nعندما يضبط المسؤول خدمة ترجمة (النظام › مفاتيح الخدمات الخارجية)، تُترجم الملاحظة إلى لغة أخرى بنقرة واحدة."
