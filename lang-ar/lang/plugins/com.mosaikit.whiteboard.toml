name = "السبورة"
description = "السبورة: لوحة مشتركة للملاحظات اللاصقة والأشكال والأسهم والرسم، يحررها عدة أشخاص مباشرة"
label = "السبورة"
details = "لوحة حرة للعصف الذهني وورش العمل والمخططات التي تُرسم معًا أثناء مكالمة: ملاحظات لاصقة ومستطيلات وأشكال بيضاوية ونصوص وأسهم وإطارات تجمع ما بداخلها ورسم بخط اليد، مع لوحة ألوان وقوالب للبدء منها (كانبان وSWOT ومراجعة وعصف ذهني) وتراجع وإعادة وتكبير وتحريك وتصدير إلى PNG أو SVG.\n\nكل من فتح اللوحة يرى تغييرات الآخرين ومؤشراتهم لحظة حدوثها. يحفظ التغييرَ في اللوحة من يحق لهم تحريرها؛ ومن لديه صلاحية القراءة فقط يتابع مباشرة لكنه لا يستطيع تغيير شيء.\n\nاللوحة عنصر في المنصة: شاركها مع أشخاص أو مجموعات (القراءة لمشاهدتها والكتابة للرسم عليها)، وينطبق عليها كل ما تعرفه عن المشاركة والبحث وسلة المحذوفات."

