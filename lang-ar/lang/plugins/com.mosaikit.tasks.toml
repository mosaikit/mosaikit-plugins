details = "احتفظ بقائمة بما يجب إنجازه، لكل مهمة تاريخ استحقاق وأولوية.\n\nأسند مهمة بمشاركتها: من يتلقاها يجدها في قائمته الخاصة. علّمها كمنجزة عند انتهائها؛ وتبقى المهام المنجزة ظاهرة حتى تقوم بترتيبها.\n\nالمهام عناصر في المنصة: لكل منها مستوى مشاركة خاص ومكان في البحث وفي سلة المحذوفات."

