name = "لوحة المعلومات"
description = "لوحة المعلومات: صفحة من الأدوات المصغرة تعرض ما يهمك في التطبيقات: المهام المفتوحة، والإشعارات المطلوب تأكيدها، والاستطلاعات المطلوب التصويت عليها، والطلبات المطلوب البتّ فيها"
label = "لوحة المعلومات"
details = "كوّن صفحة من الأدوات المصغرة التي تقدمها تطبيقات مساحة عملك: مهامك المفتوحة والمتأخرة، والإشعارات التي تنتظر تأكيدك، والاستطلاعات المطلوب التصويت عليها، والطلبات المطلوب البتّ فيها، وملاحظاتك الأخيرة. تعرض كل أداة بياناتك أنت فقط، وفق قواعد الوصول الخاصة بالتطبيق الذي تأتي منه.\n\nاللوحة قائمة من الأدوات المصغرة بالترتيب الذي اخترته، في عمود واحد أو عمودين أو ثلاثة أعمدة. احتفظ بعدد ما تشاء من اللوحات، واحدة للصباح وأخرى لمشروع، وشارك لوحة مع زميل.\n\nيضيف التطبيق أداة مصغرة إلى لوحة المعلومات من تلقاء نفسه: لا شيء يلزم ضبطه هنا، وأي أداة تتعطل لا تُخفي الأدوات الأخرى أبدًا."

