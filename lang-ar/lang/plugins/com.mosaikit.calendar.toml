name = "التقويم"
description = "التقويم: أجندة الفريق مع عروض الشهر والأسبوع واليوم، وفعاليات بأشخاص مدعوين، وتكرارات، وتواريخ استحقاق مهامك"
label = "التقويم"
details = "اكتب فعالية بيومها ووقتها وتكرارها (كل يوم أو أسبوع أو شهر أو سنة)، وادعُ أشخاصًا من مؤسستك، وشاهد كل شيء في عرض شهري أو أسبوعي أو يومي. يجيب المدعوون بنعم أو ربما أو لا، ويرى الجميع من سيحضر. الأوقات أوقات محلية تُكتب كما تدخلها تمامًا: لا يوجد تحويل للمناطق الزمنية، فاجتماع الساعة 09:30 يكون في 09:30 للجميع.\n\nتظهر المهام المفتوحة التي لها تاريخ استحقاق بجانب الفعاليات (ويمكنك إخفاؤها)، فتجتمع المواعيد النهائية والاجتماعات في مكان واحد. الفعالية عنصر في المنصة: شاركها مع المدعوين ليروها ويجيبوا، ونزّلها كملف ics. لإضافتها إلى تقويم آخر."

