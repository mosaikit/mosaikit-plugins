description = "قنوات ومحادثات في الوقت الفعلي مع الحضور والردود والتفاعلات وMarkdown"
label = "الدردشة"
details = "تحدث مع زملائك في قنوات. تصل الرسالة فورًا إلى من فتح القناة، مع معرفة من هو متصل ومن يكتب الآن.\n\nالقناة عنصر في المنصة: شاركها مع أشخاص أو مجموعات (القراءة للمتابعة والكتابة للتحدث) وينطبق عليها كل ما تعرفه عن المشاركة. تبقى الرسائل كسجل؛ اكتبها بصيغة Markdown، وردّ على إحداها، وتفاعل برمز تعبيري، وعدّل رسائلك أو احذفها."

