label = "المقتطفات"
details = "احتفظ بالنصوص والشيفرة التي يعيد فريقك استخدامها مرارًا: عنوان، والنص أو الشيفرة نفسها، ونوع (نص عادي، shell، SQL، JSON، JavaScript، Python، Rust، Markdown)، ووسوم. اعثر على مقتطف بالبحث أو بحسب النوع أو الوسم، وانسخه إلى الحافظة بنقرة واحدة.\n\nالمقتطف عنصر في المنصة: شاركه مع أشخاص أو مجموعات (القراءة للاستخدام، والكتابة للتعديل)، وينطبق عليه كل ما تعرفه عن المشاركة والبحث وسلة المحذوفات."

