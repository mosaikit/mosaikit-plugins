details = "شريط نيلي مثل شريط Teams، وشريط جانبي رمادي بالتطبيقات في مجموعات تعرض عددها، وأيقونة لكل مجموعة عند الإغلاق، ومساحة عمل بيضاء وظلال ناعمة. للتطبيقات أيقونات ثلاثية الأبعاد في الوضعين الفاتح والداكن."
