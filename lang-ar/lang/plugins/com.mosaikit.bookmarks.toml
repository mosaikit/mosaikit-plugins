name = "الإشارات المرجعية"
description = "مجموعة مشتركة من الإشارات المرجعية لروابط الويب مع ملاحظة ووسوم، للعثور عليها مجددًا ومشاركتها مع أشخاص ومجموعات"
label = "الإشارات المرجعية"
details = "احفظ الروابط التي يعود إليها فريقك كثيرًا: لكل إشارة مرجعية عنوان، وعنوان الرابط، وملاحظة، ووسوم. ابحث بأي منها، وصفِّ بحسب الوسم، وضع في المفضلة ما تستخدمه أكثر، وافتح الرابط أو انسخه بنقرة واحدة.\n\nالإشارة المرجعية عنصر في المنصة: شاركها مع أشخاص أو مجموعات (القراءة للاطلاع، والكتابة للتعديل)، وينطبق عليها كل ما تعرفه عن المشاركة والبحث وسلة المحذوفات. تُقبل عناوين http وhttps فقط، ولا يتم تنزيل أي شيء من المواقع التي تحفظها."

