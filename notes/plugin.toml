id = "com.mosaikit.notes"
name = "Note"
version = "0.3.0"
description = "Note personali, condivisibili con colleghi e gruppi"

[contribution]
icon = "📝"
label = "Note"

[[resources]]
name = "notes"
label = "Note"
title_field = "title"
fields = [
  { key = "title", label = "Titolo", kind = "text", required = true },
  { key = "body", label = "Testo", kind = "text", multiline = true },
  { key = "tag", label = "Tag", kind = "choice", options = ["personale", "lavoro", "urgente"] },
]

[ui]
entry = "index.html"

[permissions]
hooks = ["notes"]

[[kpi]]
view = "kpi_notes_by_tag"
label = "Note per tag"
