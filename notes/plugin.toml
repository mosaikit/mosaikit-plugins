id = "com.mosaikit.notes"
name = "Notes"
version = "0.7.1"
kind = "app"
# icon of the shell (Lucide); contribution.icon stays for older hosts
icon = "notebook-pen"
description = "Personal notes, shareable with colleagues and groups"
author = "Mosaikit"
details = "Write notes as coloured post-its with a title, a text and tags of your own, resize them, keep them private or share them with colleagues and groups.\n\nEvery note has its own sharing level, a public link when you need one, and a place in the search of the platform.\n\nWhen the Administrator has set a translation service (System > Keys of outside services), a note can be translated into another language with one click."
screenshots = ["list.svg", "note.svg"]
homepage = "https://example.org/mosaikit/plugins/notes"
license = "Apache-2.0"

[contribution]
icon = "📝"
label = "Notes"

[[resources]]
name = "notes"
label = "Notes"
title_field = "title"
fields = [
  { key = "title", label = "Title", kind = "text", required = true },
  { key = "body", label = "Text", kind = "text", multiline = true },
  # the first tag of the note (kept for the KPI); the tags of the note are in `tags`
  { key = "tag", label = "Tag", kind = "text", hidden = true, search = false },
  # a JSON list of tag names; the colour of each tag is in the resource note_tags
  { key = "tags", label = "Tags", kind = "text", hidden = true },
  { key = "color", label = "Colour", kind = "choice", options = ["yellow", "orange", "pink", "violet", "blue", "teal", "green", "grey"], hidden = true },
  # size of the post-it in pixels (empty: the default size)
  { key = "w", label = "Width", kind = "number", hidden = true },
  { key = "h", label = "Height", kind = "number", hidden = true },
]

# The tags of a person, each with its own colour (a note keeps the names of its tags).
[[resources]]
name = "note_tags"
label = "Note tags"
title_field = "name"
fields = [
  { key = "name", label = "Name", kind = "text", required = true },
  { key = "color", label = "Colour", kind = "choice", options = ["yellow", "orange", "pink", "violet", "blue", "teal", "green", "grey"] },
]

[ui]
entry = "index.html"

[permissions]
hooks = ["notes"]

# the pages of the app in the navigation of the shell: each layout draws them its way (a tree that
# opens, a menu at the side of the rail, a menu under a tab); the page opens at its place (msk.at)
[[nav]]
id = "all"
label = "All notes"
icon = "notebook-pen"

[[nav]]
id = "mine"
label = "Mine"
icon = "star"

[[nav]]
id = "shared"
label = "Shared with me"
icon = "users"

[[nav]]
id = "tags"
label = "By tag"
icon = "tag"

[[nav]]
id = "tag_personal"
label = "Personal"
parent = "tags"
place = "tag-personal"

[[nav]]
id = "tag_work"
label = "Work"
parent = "tags"
place = "tag-work"

[[nav]]
id = "tag_urgent"
label = "Urgent"
parent = "tags"
place = "tag-urgent"

[[kpi]]
view = "kpi_notes_by_tag"
label = "Notes by tag"

# The translation of a note (command notes.translate, "Translate" in the detail of a note). The key and the
# address of the service are set in System > Keys of outside services (the platform's or the tenant's, the key
# also the person's own): the host adds the key to the request, the logic never reads it, and the address the
# Administrator sets is the only one the plugin may call. A service with the API of LibreTranslate:
# POST <address>/translate { q: [...], source, target, format } -> { translatedText: [...] }.
[[service_keys]]
id = "translate"
label = "Translation service"
description = "Key of the service that translates the notes into other languages"

[[service_keys]]
id = "translate-endpoint"
label = "Translation service address"
description = "Web address of the service that translates the notes (for example https://translate.example.org)"
address = true
scopes = ["platform", "tenant"]

# Italian translation of the texts above (missing keys fall back to English).
[i18n.it]
details = "Scrivi note come post-it colorati con titolo, testo e tag tuoi, ridimensionali, tienile private o condividile con colleghi e gruppi.\n\nOgni nota ha il proprio livello di condivisione, un link pubblico quando serve e un posto nella ricerca della piattaforma.\n\nQuando l’Amministratore ha impostato un servizio di traduzione (Sistema > Chiavi dei servizi esterni), una nota si traduce in un’altra lingua con un clic."
name = "Note"
description = "Note personali, condivisibili con colleghi e gruppi"
label = "Note"
service_keys = { translate = { label = "Servizio di traduzione", description = "Chiave del servizio che traduce le note in altre lingue" }, translate-endpoint = { label = "Indirizzo del servizio di traduzione", description = "Indirizzo web del servizio che traduce le note (per esempio https://translate.example.org)" } }

[i18n.it.resources.notes]
label = "Note"
fields = { title = "Titolo", body = "Testo", tag = "Tag", tags = "Tag", color = "Colore", w = "Larghezza", h = "Altezza" }
options.color = { yellow = "giallo", orange = "arancione", pink = "rosa", violet = "viola", blue = "blu", teal = "turchese", green = "verde", grey = "grigio" }

[i18n.it.resources.note_tags]
label = "Tag delle note"
fields = { name = "Nome", color = "Colore" }
options.color = { yellow = "giallo", orange = "arancione", pink = "rosa", violet = "viola", blue = "blu", teal = "turchese", green = "verde", grey = "grigio" }

[i18n.it.nav]
all = "Tutte le note"
mine = "Le mie"
shared = "Condivise con me"
tags = "Per tag"
tag_personal = "Personale"
tag_work = "Lavoro"
tag_urgent = "Urgente"

[i18n.it.kpi.kpi_notes_by_tag]
label = "Note per tag"
columns = { tag = "tag", notes = "note" }
