# Official plugins of Mosaikit. A project separate from mosaikit (the folder next to it):
# the logic depends only on the SDK, the UIs only on @mosaikit/plugin-api.
[workspace]
resolver = "2"
members = [
    # plugins with WASM logic (updated by `cargo xtask plugin new`)
    "notes",
    "tasks",
    "contacts",
    "maps",
]

[workspace.package]
edition = "2021"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
mosaikit-plugin-sdk = { path = "../mosaikit/crates/plugin-sdk" }

# the WASM plugins: size more than speed
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
