<rect x="0" y="0" width="200" height="540" fill="#ffffff" stroke="#dfe2e8"/><rect x="16" y="16" width="28" height="28" rx="8" fill="#3f51b5"/><rect x="10" y="66" width="180" height="32" rx="8" fill="#e8eaf6"/><rect x="22" y="74" width="16" height="16" rx="4" fill="#3f51b5"/><text x="48" y="87" font-size="14" fill="#3f51b5" font-weight="600">Announcements</text><rect x="22" y="112" width="16" height="16" rx="4" fill="#b9bfcc"/><text x="48" y="125" font-size="14" fill="#1f2430">Documents</text><rect x="22" y="150" width="16" height="16" rx="4" fill="#b9bfcc"/><text x="48" y="163" font-size="14" fill="#1f2430">Tasks</text><rect x="22" y="188" width="16" height="16" rx="4" fill="#b9bfcc"/><text x="48" y="201" font-size="14" fill="#1f2430">Chat</text><rect x="22" y="226" width="16" height="16" rx="4" fill="#b9bfcc"/><text x="48" y="239" font-size="14" fill="#1f2430">Meet</text><line x1="0" y1="476" x2="200" y2="476" stroke="#dfe2e8"/><circle cx="30" cy="508" r="14" fill="#7b8fd1"/><text x="30" y="512" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">GM</text><text x="52" y="504" font-size="12" fill="#1f2430" font-weight="600">Giulia Marini</text><text x="52" y="519" font-size="11" fill="#6b7280">Acme srl</text><text x="228" y="44" font-size="22" fill="#1f2430" font-weight="600">Fire drill on Thursday at 11:00</text><rect x="228" y="58" width="56" height="20" rx="10" fill="none" stroke="#c62828"/><text x="256.0" y="72" font-size="11" fill="#c62828" font-weight="700" text-anchor="middle">URGENT</text><rect x="228" y="96" width="430" height="380" rx="14" fill="#ffffff" stroke="#dfe2e8"/><text x="250" y="130" font-size="14" fill="#1f2430">Everyone leaves the building by the nearest exit.</text><text x="250" y="168" font-size="14" fill="#6b7280">• Meet at the car park, group by group.</text><text x="250" y="196" font-size="14" fill="#6b7280">• The floor wardens count their people.</text><text x="250" y="224" font-size="14" fill="#6b7280">• Nobody goes back in