l="#c62828" font-weight="700" text-anchor="middle">URGENT</text><text x="350" y="124" font-size="11" fill="#6b7280">📌 Pinned</text><text x="250" y="152" font-size="17" fill="#1f2430" font-weight="600">Fire drill on Thursday at 11:00</text><text x="250" y="174" font-size="13" fill="#6b7280">Everyone leaves the building by the nearest exit.</text><rect x="250" y="184" width="120" height="34" rx="9" fill="#3f51b5"/><text x="310.0" y="206" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">I have read it</text><text x="386" y="205" font-size="12" fill="#6b7280">Confirmed by 14</text><rect x="228" y="230" width="700" height="120" rx="14" fill="#ffffff" stroke="#dfe2e8"/><rect x="228" y="230" width="5" height="120" rx="2" fill="#b9811a"/><rect x="250" y="244" width="77" height="20" rx="10" fill="none" stroke="#b9811a"/><text x="288.5" y="258" font-size="11" fill="#b9811a" font-weight="700" text-anchor="middle">IMPORTANT</text><text x="250" y="286" font-size="17" fill="#1f2430" font-weight="600">New expense policy from June</text><text x="250" y="308" font-size="13" fill="#6b7280">Receipts are required for every claim above 25 euro.</text><rect x="250" y="318" width="120" height="34" rx="9" fill="#3f51b5"/><text x="310.0" y="340" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">I have read it</text><text x="386" y="339" font-size="12" fill="#6b7280">Confirmed by 9</text><rect x="228" y="364" width="700" height="120" rx="14" fill="#ffffff" stroke="#dfe2e8"/><rect x="228" y="364" width="5" height="120" rx="2" fill="#5d86d6"/><rect x="250" y="378" width="91" height="20" rx="10" fill="none" stroke="#5d86d6"/><text x="295.5" y="392" font-size="11" fill="#5d86d6" font-weight="700" text-anchor="middle">INFORMATION</text><text x="250" y="420" font-size="17" fill="#1f2430" font-weight="600">The terrace is open for lunch</text><text x="250" y="442" font-size="13" fill="#6b7280">Tables for the whole team until the end of September.</text>
