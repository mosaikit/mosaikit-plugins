ight="700" text-anchor="middle">shell</text><text x="252" y="186" font-size="11" fill="#6b7280" font-family="Consolas, Menlo, monospace" xml:space="preserve">kubectl apply -f app.yaml</text><rect x="238" y="208" width="310" height="58" rx="9" fill="#e8eaf6" stroke="#c5cae9"/><text x="252" y="228" font-size="14" fill="#1f2430" font-weight="600">Top customers by revenue</text><rect x="497" y="214" width="35" height="20" rx="10" fill="none" stroke="#6b7280"/><text x="514.5" y="228" font-size="11" fill="#6b7280" font-weight="700" text-anchor="middle">sql</text><text x="252" y="250" font-size="11" fill="#6b7280" font-family="Consolas, Menlo, monospace" xml:space="preserve">SELECT name, SUM(total) FROM orders</text><text x="252" y="292" font-size="14" fill="#1f2430" font-weight="600">Polite reply to a complaint</text><rect x="490" y="278" width="42" height="20" rx="10" fill="none" stroke="#6b7280"/><text x="511.0" y="292" font-size="11" fill="#6b7280" font-weight="700" text-anchor="middle">text</text><text x="252" y="314" font-size="11" fill="#6b7280" font-family="Consolas, Menlo, monospace" xml:space="preserve">Dear customer, thank you for telling us</text><text x="252" y="356" font-size="14" fill="#1f2430" font-weight="600">Retry with backoff</text><rect x="476" y="342" width="56" height="20" rx="10" fill="none" stroke="#6b7280"/><text x="504.0" y="356" font-size="11" fill="#6b7280" font-weight="700" text-anchor="middle">python</text><text x="252" y="378" font-size="11" fill="#6b7280" font-family="Consolas, Menlo, monospace" xml:space="preserve">for i in range(5): sleep(2 ** i)</text><text x="252" y="420" font-size="14" fill="#1f2430" font-weight="600">CI settings</text><rect x="490" y="406" width="42" height="20" rx="10" fill="none" stroke="#6b7280"/><text x="511.0" y="420" font-size="11" fill="#6b7280" font-weight="700" text-anchor="middle">json</text><text x="252" y="442" font-size="11" fill="#6b7280" font-family="Consolas, Menlo, monospace" xml:space="preserve">{ &quot;retries&quot;: 3, &quot;timeout&quot;: 30 }</text><rect x="578" y="70" width="350" height="450" rx="14" fill="#ffffff" stroke="#dfe2e8"/><text x="600" y="108" font-size="18" fill="#1f2430" font-weight="600">Top customers by revenue</text><rect x="600" y="122" width="35" height="20" rx="10" fill="none" stroke="#6b7280"/><text x="617.5" y="136" font-size="11" fill="#6b7280" font-weight="700" text-anchor="middle">sql</text><rect x="650" y="122" width="58" height="20" rx="10" fill="#e8eaf6" stroke="#c5cae9"/><text x="679.0" y="136" font-size="11" fill="#3f51b5" font-weight="600" text-anchor="middle">report</text><rect x="714" y="122" width="65" height="20" rx="10" fill="#e8eaf6" stroke="#c5cae9"/><text x="746.5" y="136" font-size="11" fill="#3f51b5" font-weight="600" text-anchor="middle">finance</text><rect x="600" y="156" width="130" height="34" rx="9" fill="#3f51b5"/><text x="665.0" y="178" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">Copy</text><rect x="742" y="156" width="70" height="34" rx="9" fill="#ffffff" stroke="#c5cae9"/><text x="777.0" y="178" font-size="12" fill="#3f51b5" font-weight="600" text-anchor="middle">Edit</text><rect x="822" y="156" width="90" height="34" rx="9" fill="#ffffff" stroke="#c5cae9"/><text x="867.0" y="178" font-size="12" fill="#3f51b5" font-weight="600" text-anchor="middle">Share...</text><rect x="600" y="206" width="306" height="190" rx="10" fill="#eef0f5" stroke="#dfe2e8"/><text x="616" y="232" font-size="12" fill="#1f2430" font-family="Consolas, Menlo, monospace" xml:space="preserve">SELECT c.name,</text><text x="616" y="253" font-size="12" fill="#1f2430" font-family="Consolas, Menlo, monospace" xml:space="preserve">       SUM(o.total) AS revenue</text><text x="616" y="274" font-size="12" fill="#1f2430" font-family="Consolas, Menlo, monospace" xml:space="preserve">FROM orders o</text><text x="616" y="295" font-size="12" fill="#1f2430" font-family="Consolas, Menlo, monospace" xml:space="preserve">JOIN customers c</text><text x="616" y="316" font-size="12" fill="#1f2430" font-family="Consolas, Menlo, monospace" xml:space="preserve">  ON c.id = o.customer_id</text><text x="616" y="337" font-size="12" fill="#1f2430" font-family="Consolas, Menlo, monospace" xml:space="preserve">GROUP BY c.name</text><text x="616" y="358" font-size="12" fill="#1f2430" font-family="Consolas, Menlo, monospace" xml:space="preserve">ORDER BY revenue DESC</text><text x="616" y="379" font-size="12" fill="#1f2430" font-family="Consolas, Menlo, monospace" xml:space="preserve">LIMIT 10;</text><text x="600" y="420" font-size="12" fill="#6b7280">by Giulia Marini · 8 lines</text>
