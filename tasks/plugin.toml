id = "com.mosaikit.tasks"
name = "Tasks"
version = "0.4.2"
kind = "app"
# icon of the shell (Lucide); contribution.icon stays for older hosts
icon = "square-check-big"
description = "Tasks with due date and priority, assigned by sharing them"
author = "Mosaikit"
license = "Apache-2.0"

[contribution]
icon = "✅"
label = "Tasks"

[[resources]]
name = "tasks"
label = "Tasks"
title_field = "title"
# the Home of a person lists what is due soon; a done task is no longer due
due_field = "due"
done_field = "done"
fields = [
  { key = "title", label = "Title", kind = "text", required = true },
  { key = "due", label = "Due", kind = "date" },
  { key = "priority", label = "Priority", kind = "choice", options = ["low", "medium", "high"] },
  { key = "done", label = "Done", kind = "bool" },
  { key = "completed_on", label = "Completed on", kind = "date", hidden = true },
]

[ui]
entry = "index.html"

[permissions]
hooks = ["tasks"]

[[kpi]]
view = "kpi_tasks_status"
label = "Status of the tasks"

# Italian translation of the texts above (missing keys fall back to English).
[i18n.it]
name = "Attività"
description = "Attività con scadenza e priorità, assegnabili condividendole"
label = "Attività"

[i18n.it.resources.tasks]
label = "Attività"
fields = { title = "Titolo", due = "Scadenza", priority = "Priorità", done = "Fatto", completed_on = "Completata il" }
options.priority = { low = "bassa", medium = "media", high = "alta" }

[i18n.it.kpi.kpi_tasks_status]
label = "Stato delle attività"
columns = { completed = "completate", open = "aperte", overdue = "scadute" }
