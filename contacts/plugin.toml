id = "com.mosaikit.contacts"
name = "Contatti"
version = "0.3.0"
description = "Rubrica condivisibile, con email normalizzate e validate"

[contribution]
icon = "👥"
label = "Contatti"

[[resources]]
name = "contacts"
label = "Contatti"
title_field = "name"
fields = [
  { key = "name", label = "Nome", kind = "text", required = true },
  { key = "email", label = "Email", kind = "text" },
  { key = "phone", label = "Telefono", kind = "text" },
  { key = "company", label = "Azienda", kind = "choice", options = ["Interna", "Cliente", "Partner", "Fornitore"] },
]

[ui]
entry = "index.html"

[permissions]
hooks = ["contacts"]

[[kpi]]
view = "kpi_contacts_by_company"
label = "Contatti per tipo di azienda"
