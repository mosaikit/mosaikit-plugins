name = "Chat"
description = "Chat como Microsoft Teams: chats individuales y de grupo con presencia, confirmaciones de lectura, reacciones, menciones, archivos y llamadas"
label = "Chat"
details = "Habla con tus compañeros como en Microsoft Teams: chats individuales y de grupo, una lista con los mensajes sin leer, chats fijados y silenciados, quién está en línea, quién está escribiendo y quién ha visto tu mensaje.\n\nEscribe con formato, menciona a personas con @, marca un mensaje como Importante o Urgente, responde con una cita, reacciona con un emoji, fija un mensaje, adjunta archivos desde tu dispositivo o desde Documentos y busca lo que se dijo. Los botones Llamar y Vídeo inician una llamada de grupo en el chat, y la llamada queda en la conversación con quién entró y cuánto duró.\n\nUn chat es privado para quienes participan: se comparte con cada uno y cualquiera puede añadir personas (con o sin el historial anterior). El historial que un recién llegado no ve lo oculta la página, no la plataforma. Los canales de las versiones anteriores siguen ahí, en Canales.\n\nLo que pide el plugin: encontrar a las personas de tu organización con las que chatear (directorio), avisarlas (notificaciones), mostrar el servicio de llamadas (meet.jit.si) con cámara y micrófono, y leer y añadir archivos en Documentos para los adjuntos."

