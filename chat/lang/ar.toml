name = "الدردشة"
description = "دردشة مثل Microsoft Teams: دردشات فردية وجماعية مع الحضور وإشعارات القراءة والتفاعلات والإشارات والملفات والمكالمات"
label = "الدردشة"
details = "تحدث مع زملائك كما في Microsoft Teams: دردشات فردية وجماعية، وقائمة بعدد الرسائل غير المقروءة، ودردشات مثبتة ومكتومة، ومن هو متصل، ومن يكتب الآن، ومن شاهد رسالتك.\n\nاكتب بتنسيق، وأشر إلى الأشخاص بـ @، وضع على الرسالة علامة مهم أو عاجل، وردّ باقتباس، وتفاعل برمز تعبيري، وثبّت رسالة، وأرفق ملفات من جهازك أو من المستندات، وابحث عمّا قيل. يبدأ زرّا المكالمة والفيديو مكالمة جماعية داخل الدردشة، وتبقى المكالمة في المحادثة مع من انضم ومدتها.\n\nالدردشة خاصة بالمشاركين فيها: تُشارك مع كل واحد منهم، ويمكن لأي شخص فيها إضافة أشخاص (مع المحفوظات السابقة أو بدونها). المحفوظات التي لا يراها القادم الجديد تُخفيها الصفحة وليست المنصة. القنوات من الإصدارات السابقة ما زالت موجودة في القنوات.\n\nما يطلبه المكوّن الإضافي: العثور على أشخاص من مؤسستك للدردشة معهم (الدليل)، وتنبيههم (الإشعارات)، وعرض خدمة المكالمات (meet.jit.si) مع الكاميرا والميكروفون، وقراءة الملفات وإضافتها في المستندات للمرفقات."

