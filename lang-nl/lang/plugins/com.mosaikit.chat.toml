name = "Chat"
description = "Chat zoals Microsoft Teams: individuele chats en groepschats met aanwezigheid, leesbevestigingen, reacties, vermeldingen, bestanden en gesprekken"
label = "Chat"
details = "Praat met je collega's zoals in Microsoft Teams: individuele chats en groepschats, een lijst met ongelezen berichten, vastgemaakte en gedempte chats, wie online is, wie er typt en wie je bericht heeft gezien.\n\nSchrijf met opmaak, vermeld personen met @, markeer een bericht als Belangrijk of Urgent, antwoord met een citaat, reageer met een emoji, maak een bericht vast, voeg bestanden toe vanaf je apparaat of uit Documenten en zoek wat er is gezegd. De knoppen Bellen en Video starten een groepsgesprek in de chat, en het gesprek blijft in de conversatie staan met wie er meedeed en hoe lang het duurde.\n\nEen chat is privé voor wie eraan deelneemt: hij wordt met iedereen gedeeld en iedereen kan personen toevoegen (met of zonder de eerdere geschiedenis). De geschiedenis die een nieuwkomer niet ziet, wordt door de pagina verborgen, niet door het platform. De kanalen van eerdere versies staan er nog, onder Kanalen.\n\nWat de plugin vraagt: de personen van je organisatie vinden om mee te chatten (map), hen waarschuwen (meldingen), de gespreksdienst (meet.jit.si) tonen met camera en microfoon, en bestanden in Documenten lezen en toevoegen voor de bijlagen."

