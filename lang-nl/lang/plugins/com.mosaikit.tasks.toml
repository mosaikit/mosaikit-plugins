label = "Taken"
details = "Houd een lijst bij van dingen die moeten gebeuren, elk met deadline en prioriteit.\n\nWijs een taak toe door hem te delen: wie hem ontvangt, vindt hem in de eigen lijst. Markeer hem als gedaan als hij klaar is; gedane taken blijven zichtbaar tot je ze opruimt.\n\nTaken zijn items van het platform: ze hebben hun eigen deelniveau, een plek in de zoekfunctie en in de prullenbak."

