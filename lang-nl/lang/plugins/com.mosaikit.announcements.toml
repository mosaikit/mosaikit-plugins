name = "Mededelingen"
description = "Een mededelingenbord: publiceer mededelingen met een niveau en een periode, en zie wie heeft bevestigd ze te hebben gelezen"
label = "Mededelingen"
details = "Publiceer een mededeling voor de mensen met wie je deelt: een titel, een tekst in Markdown, een niveau (informatie, belangrijk of urgent) en de periode waarin de mededeling geldt. Urgente en vastgezette mededelingen blijven bovenaan staan.\n\nAls een mededeling om bevestiging vraagt, bevestigt elke lezer met één klik en ziet de auteur wie dat deed en wanneer.\n\nEen mededeling is een item van het platform: deel hem met personen of groepen (lezen om hem te volgen, schrijven om hem te bewerken) en alles wat je al weet over delen, zoeken en de prullenbak geldt ook hier."

