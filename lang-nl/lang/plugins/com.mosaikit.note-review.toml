details = "Voegt een tabblad Beoordeling toe aan de notities van de app Notities. Wie beoordeelt, markeert een notitie als beoordeeld, met een optionele opmerking; het tabblad toont wie het deed, wanneer en de geschiedenis van de beoordelingen.\n\nEen extensie: werkt alleen waar Notities is geïnstalleerd, en haar recht bepaalt wie mag beoordelen."
