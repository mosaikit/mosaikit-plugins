details = "Añade una pestaña Revisión a las notas de la app Notas. Quien revisa marca una nota como revisada, con un comentario opcional; la pestaña muestra quién lo hizo, cuándo y el historial de las revisiones.\n\nUna extensión: solo funciona donde está instalada Notas, y su permiso decide quién puede revisar."
