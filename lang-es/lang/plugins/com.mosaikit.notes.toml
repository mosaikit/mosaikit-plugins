name = "Notas"
description = "Notas personales, que se pueden compartir con compañeros y grupos"
label = "Notas"
details = "Escribe notas como post-its de colores con título, texto y etiquetas propias, cambia su tamaño, mantenlas privadas o compártelas con compañeros y grupos.\n\nCada nota tiene su propio nivel de compartición, un enlace público cuando hace falta y un lugar en la búsqueda de la plataforma.\n\nCuando el administrador ha configurado un servicio de traducción (Sistema › Claves de servicios externos), una nota se traduce a otro idioma con un clic."
