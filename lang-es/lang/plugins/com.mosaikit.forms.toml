name = "Formularios"
description = "Crea un formulario, comparte un enlace público para recoger respuestas de cualquiera sin cuenta y lee las respuestas en una tabla o en un CSV"
label = "Formularios"
details = "Crea un formulario con hasta 30 campos (una línea de texto, un texto largo, una opción, varias opciones, un número, una fecha o una dirección de correo), marca cuáles son obligatorios y compártelo: con tus compañeros, que responden dentro de la plataforma, o con un enlace público que cualquiera puede abrir y rellenar sin cuenta.\n\nFija cuándo se cierra el formulario y el número máximo de respuestas. Las respuestas van a una tabla con el recuento por opción, y puedes exportarlas a CSV o eliminar una, por ejemplo una de spam. Un visitante nunca ve las respuestas de los demás, ni cuántas hay. Un campo puede mostrarse solo cuando coincide una respuesta anterior, y un formulario anónimo no guarda ningún nombre junto a las respuestas.\n\nEl enlace público necesita la política del tenant «Comandos públicos», que activa el Tenant Manager. Un formulario es un elemento de la plataforma: compártelo con personas o grupos (lectura para rellenarlo, escritura para ver las respuestas y editarlo) y vale todo lo que ya sabes sobre compartir, buscar y la papelera."

