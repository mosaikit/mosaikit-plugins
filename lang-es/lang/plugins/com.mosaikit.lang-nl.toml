name = "Neerlandés (Nederlands)"
description = "Interfaz en neerlandés: la plataforma y los textos de manifiesto de los plugins oficiales"
label = "Nederlands"
details = "Interfaz en neerlandés para la plataforma y para los nombres de los plugins oficiales (campos, opciones e indicadores). Los textos dentro de las páginas de un plugin los dibuja el propio plugin: donde no tiene un texto en neerlandés quedan en inglés.\n\nPara añadir otro idioma, copia este plugin."
