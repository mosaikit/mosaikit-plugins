name = "Calendario"
description = "La agenda del equipo: vistas por mes, semana y día, eventos con personas invitadas, repeticiones y las fechas de vencimiento de tus tareas"
label = "Calendario"
details = "Escribe un evento con su día, su hora y una repetición (cada día, semana, mes o año), invita a personas de tu organización y míralo todo en una vista por mes, semana o día. Los invitados responden sí, quizá o no, y todos ven quién asiste. Las horas son horas locales, escritas tal como las tecleas, salvo que des al evento una zona horaria: entonces se muestra a la hora correcta dondequiera que esté cada persona. En una serie que se repite puedes cambiar o eliminar una sola repetición.\n\nLas tareas abiertas con fecha de vencimiento aparecen junto a los eventos (puedes ocultarlas), de modo que plazos y reuniones están en un mismo lugar. Un evento es un elemento de la plataforma: compártelo con los invitados para que lo vean y respondan, y descárgalo como archivo .ics para añadirlo a otro calendario."

